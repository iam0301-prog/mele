# =====================================================================
# Mele 命理媒介中心 — 西洋占星文案
# =====================================================================
# v1 範圍：
#   - sun_signs       : 太陽 × 12 星座（核心自我 / 生命主軸）
#   - moon_signs      : 月亮 × 12 星座（情緒底色 / 安全感模式）
#   - rising_signs    : 上升 × 12 星座（外顯 / 與世界互動的窗口）
#   - houses          : 12 宮位簡介（哪一塊人生領域）
#   - planet_in_house : 重點行星 × 宮位組合（選擇性，不全列）
#
# 客戶端 (/tools/astro) 使用 teaser.friend
# 老師後台 voice tab 切換 full.master
#
# YAML key 體例：
#   - 星座：中文名稱（牡羊 / 金牛 / ...）
#   - 宮位：序號（1~12，整數）
#
# Voice 原則：master = 溫暖長者，敢說重話、有時刻、有暗面、有立場
# =====================================================================

schema_version: 1

# ---------------------------------------------------------------------
# 太陽星座（核心自我）—— 12 個
# ---------------------------------------------------------------------
sun_signs:
  "牡羊":
    element: "火"
    quality: "本位"
    teaser:
      friend: |
        牡羊太陽是「我要、我衝、我先」。問題不在你快，是你常常衝過頭才回頭找隊友。30 歲後你會學會：開頭的人不必每次都跑第一個。
    full:
      master:
        core: |
          純粹的「我」、開創、行動先於思考。生命題目是學會領導不必獨行。
        shadow: |
          急躁、自我中心、用「我直接」當不顧及別人感受的擋箭牌。
        relationship: |
          愛情裡會主動，但易在「贏到」之後失去興趣。需要會踩煞車的伴侶。
        growth: |
          這個月做一件「等別人先動」的事。看自己會不會受不了——通常會，但練。

  "金牛":
    element: "土"
    quality: "固定"
    teaser:
      friend: |
        金牛太陽是「我擁有、我感受、我穩住」。問題不在你慢，是你慢到把該放的也抓著。30 歲後你會學會：真正的安全感不是擁有多少，是知道失去也活得下去。
    full:
      master:
        core: |
          身體性、物質性、對舒適與美的天然嚮往。生命題目是學會擁有與放手並存。
        shadow: |
          固執、佔有慾、把改變視為威脅。把「我喜歡這樣」當不調整的理由。
        relationship: |
          忠誠且穩定，但抗拒對方的成長。需要願意一起變化的伴侶。
        growth: |
          這個月主動放下一個你佔著很久但不再需要的東西。物理或關係都可。

  "雙子":
    element: "風"
    quality: "變動"
    teaser:
      friend: |
        雙子太陽是「我連結、我傳遞、我好奇」。問題不在你跳，是你常常什麼都接但什麼都不深。30 歲後你會學會：深度不是死板，是允許自己在一件事上停下來。
    full:
      master:
        core: |
          語言、訊息流動、心智靈活。生命題目是學會在多元中選擇深度。
        shadow: |
          淺嚐輒止、用幽默逃避深入、社交廣但缺真實連結。
        relationship: |
          能聊一輩子但難承諾。需要懂得「無聊也是親密」的伴侶。
        growth: |
          這個月選一個主題，深做 30 天。不換、不分心、不找新刺激。

  "巨蟹":
    element: "水"
    quality: "本位"
    teaser:
      friend: |
        巨蟹太陽是「我滋養、我守護、我感受家」。問題不在你軟，是你軟到把該說的話都吞下去。30 歲後你會學會：真正的家是你敢說真話的地方，不是你忍最多的地方。
    full:
      master:
        core: |
          情感、歸屬、養育力。生命題目是學會照顧自己跟照顧別人並重。
        shadow: |
          情感勒索、過度保護、用「我是為了你好」綁住對方。
        relationship: |
          深情但黏、愛恨記得久。需要懂得回應你情緒但不被淹沒的伴侶。
        growth: |
          這個月對家人說一句你忍了很久沒說的真話。不解釋、不道歉。

  "獅子":
    element: "火"
    quality: "固定"
    teaser:
      friend: |
        獅子太陽是「我發光、我創造、我被看見」。問題不在你想被看見，是你把所有不被看見的時刻都當成失敗。30 歲後你會學會：暗下來不是消失，是換光源。
    full:
      master:
        core: |
          創造、表達、心的慷慨。生命題目是學會從「需要被看見」進化為「願意看見別人」。
        shadow: |
          自我膨脹、要掌聲、把忽視當侮辱、容易被諂媚迷惑。
        relationship: |
          愛得熱烈但要求崇拜。需要欣賞你又不卑微的伴侶。
        growth: |
          這個月把一次該屬於你的掌聲，主動讓給身邊一個一直被你蓋過光的人。

  "處女":
    element: "土"
    quality: "變動"
    teaser:
      friend: |
        處女太陽是「我分析、我精進、我服務」。問題不在你細，是你細到連別人的不完美都讓你受不了。30 歲後你會學會：完美是空集合，活著的都不完美。
    full:
      master:
        core: |
          辨識力、實用、服務精神。生命題目是學會接受「夠好」就是完美。
        shadow: |
          過度批評、為他人焦慮過頭、把「我是為了把事做好」當不放手的擋箭牌。
        relationship: |
          忠誠且願意付出，但易嘮叨。需要承受得住你細節又不被改造的伴侶。
        growth: |
          這個月對一件不完美的事說「夠好了」並交出去。不修、不補、不再優化。

  "天秤":
    element: "風"
    quality: "本位"
    teaser:
      friend: |
        天秤太陽是「我平衡、我關係、我和諧」。問題不在你會圓，是你圓到自己想要什麼都不知道。30 歲後你會學會：和諧不是討好，是真實地不同意之後仍能共處。
    full:
      master:
        core: |
          關係、美感、公平。生命題目是學會在和諧中保留自我立場。
        shadow: |
          決策困難、討好、用「我為了大家好」掩飾不敢得罪人。
        relationship: |
          擅長關係但易為了對方失去自己。需要不會讓你消失的伴侶。
        growth: |
          這個月做三個決定不問別人意見。錯了也好，至少是你的決定。

  "天蠍":
    element: "水"
    quality: "固定"
    teaser:
      friend: |
        天蠍太陽是「我深入、我蛻變、我穿透假象」。問題不在你深，是你常把深當成防備他人的城牆。30 歲後你會學會：深的人也可以被看見，被看見不是被傷害。
    full:
      master:
        core: |
          心理深度、轉化、權力與信任。生命題目是學會把控制換成親密。
        shadow: |
          猜疑、報復、用沉默懲罰、把「我看穿你」當不真實連結的擋箭牌。
        relationship: |
          愛得徹底也痛得徹底。需要承受得住你陰影又不被吞掉的伴侶。
        growth: |
          這個月對一個信任的人說一件你最不想被看見的事。練習被看見不會死。

  "射手":
    element: "火"
    quality: "變動"
    teaser:
      friend: |
        射手太陽是「我擴張、我自由、我尋找意義」。問題不在你飛，是你常常把承諾當作牢籠。30 歲後你會學會：真正的自由不是不被綁，是選擇被什麼綁。
    full:
      master:
        core: |
          擴張、信念、跨界。生命題目是學會在自由中承諾。
        shadow: |
          逃避深入、好為人師、用「我只是直話直說」傷人。
        relationship: |
          熱情但怕被困住。需要願意一起冒險又不會跟丟的伴侶。
        growth: |
          這個月對一件你一直保留退路的事下決心承諾 6 個月。

  "摩羯":
    element: "土"
    quality: "本位"
    teaser:
      friend: |
        摩羯太陽是「我建造、我承擔、我留下成就」。問題不在你扛，是你扛到忘了人生不是 KPI。30 歲後你會學會：成就如果沒有人陪你慶祝，就只是疲倦。
    full:
      master:
        core: |
          結構、責任、長線經營。生命題目是學會在攀登中允許享受。
        shadow: |
          冷硬、控制、用工作逃避情感、把成就當自我證明。
        relationship: |
          忠誠負責但情感壓抑。需要願意陪你軟下來的伴侶。
        growth: |
          這個月安排一次「沒目的」的休假。不工作、不規劃、不證明自己有效率。

  "水瓶":
    element: "風"
    quality: "固定"
    teaser:
      friend: |
        水瓶太陽是「我獨立、我創新、我關心眾人」。問題不在你特別，是你常把獨特當不必跟人深的擋箭牌。30 歲後你會學會：關心人類很容易，關心一個具體的人才難。
    full:
      master:
        core: |
          創新、群體意識、未來感。生命題目是學會從理念走到關係。
        shadow: |
          疏離、為了不同而不同、用「我這人比較冷」逃避親密。
        relationship: |
          能成為朋友但難變愛人。需要懂你抽離又能拉你回來的伴侶。
        growth: |
          這個月對一個具體的人做一次具體的關心。不是想法、不是理論。

  "雙魚":
    element: "水"
    quality: "變動"
    teaser:
      friend: |
        雙魚太陽是「我感受、我消融、我與更大的東西連線」。問題不在你軟，是你常分不清自己跟別人的感受。30 歲後你會學會：感受深的人最需要的不是逃避，是邊界。
    full:
      master:
        core: |
          靈性、慈悲、創造力。生命題目是學會在融合中保持自己。
        shadow: |
          逃避現實、扮演受害者、把「我太敏感」當不負責任的擋箭牌。
        relationship: |
          能與對方融為一體但也易迷失自我。需要會把你拉回來的伴侶。
        growth: |
          這個月對一段消耗你的關係 / 場域劃下明確界線。不解釋、不道歉。

# ---------------------------------------------------------------------
# 12 宮位框架（行星落入哪個宮 = 在哪個人生領域顯化）
# ---------------------------------------------------------------------
houses:
  1:
    domain: "自我 / 外貌 / 起手式"
    teaser: |
      第一宮是「你給世界的第一印象」。重點不是別人怎麼看你，是你準備怎麼出場。
    note: |
      重要落點：上升星座 / 任何在 1 宮的行星都會強烈塑造個人外顯氣質。
  2:
    domain: "金錢 / 價值 / 擁有"
    teaser: |
      第二宮不只是錢——是你定義「什麼有價值」的方式。錢只是其中一種形式。
    note: |
      行星落 2 宮：金錢觀、財務模式、自我價值的依託。
  3:
    domain: "溝通 / 學習 / 手足 / 短程移動"
    teaser: |
      第三宮是日常的訊息流。你怎麼說話、怎麼學、怎麼跟近距離的人互動。
    note: |
      水星天然主管。落 3 宮的行星影響表達與心智節奏。
  4:
    domain: "家 / 根 / 內在的安全感"
    teaser: |
      第四宮是地基——你從哪裡來、你的「家」如何形塑你內在最深的部分。
    note: |
      月亮天然主管。4 宮行星往往跟家族議題、原生創傷有關。
  5:
    domain: "創造 / 戀愛 / 孩子 / 自我表達"
    teaser: |
      第五宮是「我把自己活出來」的領域——玩、愛、創作、不必有用的事。
    note: |
      太陽天然主管。5 宮強的人需要被看見的舞台。
  6:
    domain: "工作 / 健康 / 日常服務"
    teaser: |
      第六宮是日復一日的微觀——你怎麼工作、怎麼照顧身體、怎麼建立習慣。
    note: |
      水星 / 處女主題。6 宮行星揭示日常壓力與身體訊號模式。
  7:
    domain: "夥伴 / 婚姻 / 一對一關係"
    teaser: |
      第七宮是「對面的人」——你選擇的伴侶其實常是你看不見的自己。
    note: |
      金星天然主管。7 宮行星揭示親密關係的吸引模式與課題。
  8:
    domain: "深度 / 死亡與重生 / 共享資源 / 性"
    teaser: |
      第八宮是不能用日光談的東西——親密深處、轉化、共同擁有的權力與金錢。
    note: |
      天蠍 / 冥王主題。8 宮行星揭示禁忌、控制議題、深層蛻變。
  9:
    domain: "哲學 / 高等教育 / 遠方 / 信念"
    teaser: |
      第九宮是「擴張的視野」——你相信什麼、你願意走多遠去找答案。
    note: |
      木星天然主管。9 宮行星影響信念系統與跨文化經驗。
  10:
    domain: "事業 / 名聲 / 社會角色"
    teaser: |
      第十宮是世界看見你的方式——不是你的工作，是你的「社會位置」。
    note: |
      摩羯 / 土星主題。MC（天頂）落點往往指示天職方向。
  11:
    domain: "朋友 / 社群 / 願景"
    teaser: |
      第十一宮是你的「部落」——什麼樣的群體跟你共振、你為什麼樣的未來努力。
    note: |
      水瓶主題。11 宮行星揭示同溫層與長期願景的形狀。
  12:
    domain: "潛意識 / 隱藏 / 靈性 / 自我消融"
    teaser: |
      第十二宮是最深的暗處——夢、上癮、靈感、需要獨處才能聽見的聲音。
    note: |
      雙魚 / 海王主題。12 宮行星揭示集體無意識與療癒功課。

# ---------------------------------------------------------------------
# 月亮星座（情緒底色 / 安全感模式）—— 12 個
# ---------------------------------------------------------------------
# 月亮不是「你想成為的人」，是「你疲倦時自動退回去的狀態」。
# 也是你內在那個「想被怎麼照顧」卻常常說不出口的部分。
# ---------------------------------------------------------------------
moon_signs:
  "牡羊":
    teaser:
      friend: |
        月亮牡羊的人，情緒像火柴——點得快、燒得旺、滅得也快。你不會悶很久，但你也常常還沒處理完情緒就已經行動了。
    full:
      master:
        core: |
          情緒直接、需要立刻表達、靠行動釋放。
        need: |
          需要的不是被安撫，是被允許「現在很氣」「現在不爽」而不被評價。
        shadow: |
          脾氣來去太快導致別人受傷後你已經沒事，留下對方獨自處理。
        focus: |
          下次情緒一上來，先 10 秒寫下，再決定要不要說出口。

  "金牛":
    teaser:
      friend: |
        月亮金牛的人，情緒慢、定、需要實體的安撫——一頓飯、一個擁抱、一張柔軟的床。你不喜歡突然的改變，連被打擾吃飯都會生氣。
    full:
      master:
        core: |
          情緒透過身體與物質安頓。
        need: |
          需要穩定的環境、可預期的節奏、能擁抱的人。改變對你是真實的壓力。
        shadow: |
          抗拒改變到了過時也不肯放手；用吃 / 購物麻痺情緒。
        focus: |
          每週給自己一個固定的「身體療癒儀式」——按摩、散步、做飯。

  "雙子":
    teaser:
      friend: |
        月亮雙子的人，情緒需要被「說出來」才會消化。你會分析自己的感受，但有時分析到把感受弄丟。
    full:
      master:
        core: |
          情緒透過語言與訊息處理。
        need: |
          需要能聊的對象、需要把感受變成文字、需要多元的精神刺激。
        shadow: |
          用聰明把情緒包裝掉；停不下來的內在 OS 讓你失眠。
        focus: |
          每天 10 分鐘寫情緒日記——不分析，只寫感受。

  "巨蟹":
    teaser:
      friend: |
        月亮巨蟹的人，情緒是核心引擎——你的世界以感受為座標。你能記得別人忘記的事，也容易把過去的傷重複拿出來。
    full:
      master:
        core: |
          情緒深、記性強、家庭感是底色。
        need: |
          需要被滋養、需要可以哭的空間、需要一個感覺像家的人。
        shadow: |
          情緒勒索、過度反芻舊傷、把照顧別人當不照顧自己的擋箭牌。
        focus: |
          這週設一個「我也需要被照顧」的具體請求對信任的人提出。

  "獅子":
    teaser:
      friend: |
        月亮獅子的人，情緒需要舞台——被看見、被肯定、被讚美。你不愛假裝謙虛，因為謙虛讓你覺得不被愛。
    full:
      master:
        core: |
          情緒透過被看見而被滿足。
        need: |
          需要真誠的讚美、需要主場時刻、需要對方眼裡有你。
        shadow: |
          沒被注意時的失落會放大；對忽視的反應比實際傷害大很多。
        focus: |
          這週給自己一個慶祝——不為了任何成就，就是讓自己被自己看見。

  "處女":
    teaser:
      friend: |
        月亮處女的人，情緒需要「被整理」才能安心。你常用做事、清理、檢查來消化感受，但有時你忘了——感受不需要被解決，只需要被感受。
    full:
      master:
        core: |
          情緒透過秩序與服務感被安頓。
        need: |
          需要乾淨的環境、需要明確的責任、需要把混亂分類好。
        shadow: |
          焦慮、過度自我批評、用「我幫忙」逃避自己的脆弱。
        focus: |
          這週允許自己有 1 件「沒整理好」的事過夜不處理。練習與不完美共存。

  "天秤":
    teaser:
      friend: |
        月亮天秤的人，情緒需要「和諧」才能安心——衝突會讓你身體不舒服。但你常常為了維持表面平靜，把真正的感受吞掉。
    full:
      master:
        core: |
          情緒透過關係與美感被調節。
        need: |
          需要溫柔的對話、優雅的環境、不被迫立刻表態的空間。
        shadow: |
          逃避衝突到極致；用討好換和平，最後對自己生氣。
        focus: |
          這週對一件你「都可以」的事明確說出偏好。練習有立場不會失去愛。

  "天蠍":
    teaser:
      friend: |
        月亮天蠍的人，情緒深、烈、藏得緊。你愛得徹底也痛得徹底，常常選擇沉默是因為說不清那麼多層。
    full:
      master:
        core: |
          情緒層次深、需要絕對信任才能交付。
        need: |
          需要徹底的隱私、需要被相信、需要對方不怕你的深。
        shadow: |
          猜疑、報復、用沉默懲罰、把不講當成保護自己。
        focus: |
          對一個信任的人說一句你最不想被看見的感受。被看見不會殺死你。

  "射手":
    teaser:
      friend: |
        月亮射手的人，情緒需要「空間」才能呼吸——被綁住會讓你窒息。你會用幽默和遠方消化情緒，但別讓「我沒事」變成口頭禪。
    full:
      master:
        core: |
          情緒透過自由與意義感被滿足。
        need: |
          需要可以走的選項、需要相信的事、需要遠景而非小規定。
        shadow: |
          用樂觀逃避深處的傷；用「我隨時可以走」當不深入的擋箭牌。
        focus: |
          這週對一段你想逃離的關係或情境，停一週不行動。先感受再決定。

  "摩羯":
    teaser:
      friend: |
        月亮摩羯的人，情緒從小就被訓練成「忍耐」。你能扛、會獨立，但你內在常有個被忽略的孩子，需要被允許脆弱。
    full:
      master:
        core: |
          情緒壓抑、責任感重、靠成就感補償內在的不足。
        need: |
          需要被允許脆弱、需要不必證明也被愛、需要慢下來的時刻。
        shadow: |
          冷硬、把感受當不專業、用工作逃避情緒、看不起自己的軟。
        focus: |
          這週對一個信任的人說「我也會累」「我也會怕」。不解釋為什麼。

  "水瓶":
    teaser:
      friend: |
        月亮水瓶的人，情緒處理像實驗——抽離、觀察、分析。你不愛黏，需要有獨立的空間才不會崩潰。
    full:
      master:
        core: |
          情緒透過抽離與理性化被處理。
        need: |
          需要獨處的時間、需要不被情緒綁架的關係、需要新鮮的精神刺激。
        shadow: |
          用「我很冷靜」逃避真實感受；把抽離當成優越感。
        focus: |
          這週允許自己「沒邏輯地難過」一次。不分析、不解釋，就是難過。

  "雙魚":
    teaser:
      friend: |
        月亮雙魚的人，情緒像海——能感受別人的情緒比感受自己的更清楚。你需要安靜的時刻把別人的情緒退潮，才能找回自己的。
    full:
      master:
        core: |
          情緒邊界模糊、共感力強、靈性敏感度高。
        need: |
          需要獨處的儀式、需要藝術 / 音樂 / 自然、需要對自己慈悲。
        shadow: |
          逃避現實、用幻想麻痺自己、扮演拯救者最後耗盡。
        focus: |
          每天 15 分鐘獨處——關手機、不對外。讓別人的情緒退場，自己回家。

# ---------------------------------------------------------------------
# 上升星座（外顯 / 與世界互動的窗口）—— 12 個
# ---------------------------------------------------------------------
# 上升不是你的本質，是你「打開門時別人先看見的那一層」。
# 也是你下意識用來保護真實自我的氣質。
# ---------------------------------------------------------------------
rising_signs:
  "牡羊":
    teaser:
      friend: |
        上升牡羊的人，給人「衝、直、有活力」的第一印象。你進房間像帶風進來。但別人不一定知道你裡面其實常常在自我懷疑。
    full:
      master:
        external: |
          動作快、語速急、表情直接、眼神有火。
        mask: |
          用「我沒在怕」的氣質遮住真正的緊張。
        adjustment: |
          世界誤以為你不需要被照顧。練習主動說「我需要支援」。

  "金牛":
    teaser:
      friend: |
        上升金牛的人，給人「穩、不慌、有質感」的第一印象。你開口慢、決定慢，但給人安全感。
    full:
      master:
        external: |
          氣質沉穩、聲音平、動作不急、講究衣著與物品。
        mask: |
          用「不在乎」的穩遮住其實已經很在意。
        adjustment: |
          世界以為你不會被打擾。練習表達「這件事其實影響我」。

  "雙子":
    teaser:
      friend: |
        上升雙子的人，給人「活潑、好聊、什麼都知道一點」的第一印象。你能融入任何場子，但常常聊完才發現沒人真的認識你。
    full:
      master:
        external: |
          話多、反應快、表情多、容易吸引第一眼但難留住深度。
        mask: |
          用幽默和話題遮住深處的不安。
        adjustment: |
          世界以為你很 open。練習在熟人前安靜——讓他們認識真實的你。

  "巨蟹":
    teaser:
      friend: |
        上升巨蟹的人，給人「溫柔、好接近、像家裡的人」的第一印象。你的關懷是真的，但你也常被當成「天然的照顧者」被佔便宜。
    full:
      master:
        external: |
          眼神柔、語氣關懷、容易記住別人的細節。
        mask: |
          用「我來照顧你」的姿態遮住自己也想被照顧。
        adjustment: |
          世界以為你不需要回報。練習對「不對等的關係」說不。

  "獅子":
    teaser:
      friend: |
        上升獅子的人，給人「亮、有氣場、自帶聚光燈」的第一印象。你笑起來會讓整個房間轉頭，但你也常被別人嫉妒而不自知。
    full:
      master:
        external: |
          氣場大、笑容明亮、姿態挺、衣著喜歡有亮點。
        mask: |
          用自信的外表遮住怕被忽視的脆弱。
        adjustment: |
          世界誤以為你很堅強。允許自己有「不發光」的日子。

  "處女":
    teaser:
      friend: |
        上升處女的人，給人「乾淨、細心、有點拘謹」的第一印象。你給人專業感，但別人常忘了問你今天累不累。
    full:
      master:
        external: |
          整齊、有條理、說話精確、不喜歡浮誇。
        mask: |
          用完美主義的外表遮住對自己嚴格的焦慮。
        adjustment: |
          世界以為你不需要犯錯。練習公開展示一次自己的不完美。

  "天秤":
    teaser:
      friend: |
        上升天秤的人，給人「優雅、好相處、漂亮」的第一印象。你天然會調解氣氛，但常被當成「沒立場的好人」。
    full:
      master:
        external: |
          氣質優雅、容貌端正、聲音溫和、講究禮節。
        mask: |
          用「都可以」的隨和遮住其實有強烈偏好。
        adjustment: |
          世界以為你不在意。練習在第一次就明確說出立場。

  "天蠍":
    teaser:
      friend: |
        上升天蠍的人，給人「強烈、神秘、有點壓迫感」的第一印象。你的眼神會讓人覺得被看穿，第一次見面要嘛印象深刻、要嘛覺得你冷。
    full:
      master:
        external: |
          眼神深、不多話、氣場濃、衣著常黑色或極簡。
        mask: |
          用沉默和距離遮住其實感情很濃。
        adjustment: |
          世界以為你高冷。練習對信任的人主動釋出溫度。

  "射手":
    teaser:
      friend: |
        上升射手的人，給人「開朗、自由、像剛從遠方回來」的第一印象。你笑容大方，但別人常以為你不需要被照顧。
    full:
      master:
        external: |
          笑容大、走路快、聲音爽朗、衣著休閒不拘束。
        mask: |
          用「我超 ok」的開朗遮住其實也會難過。
        adjustment: |
          世界以為你不會卡住。練習對親近的人說「我現在很迷惘」。

  "摩羯":
    teaser:
      friend: |
        上升摩羯的人，給人「成熟、靠譜、看起來比實際年紀大」的第一印象。你年輕時被當大人，老了反而越來越像孩子。
    full:
      master:
        external: |
          姿態端正、表情嚴肅、衣著正式或經典款、寡言。
        mask: |
          用專業感的外表遮住內在那個沒長大的孩子。
        adjustment: |
          世界以為你不會玩。練習做一件「不專業、純好玩」的事。

  "水瓶":
    teaser:
      friend: |
        上升水瓶的人，給人「特別、難以歸類、像外星來的」的第一印象。你跟人熟之後常聽到「你跟我想的不一樣」。
    full:
      master:
        external: |
          氣質獨特、衣著不從眾、眼神帶點抽離感。
        mask: |
          用「我跟你們不同」的氣質遮住想被理解的渴望。
        adjustment: |
          世界以為你不需要連結。練習對一個具體的人說「我想多認識你」。

  "雙魚":
    teaser:
      friend: |
        上升雙魚的人，給人「夢幻、好接近、眼神有故事」的第一印象。你像水一樣會適應對方，但也常被當成沒主見。
    full:
      master:
        external: |
          眼神柔、姿態流動、容易讓人投射情感、氣質藝術。
        mask: |
          用「都可以」「沒關係」遮住其實有清楚的不舒服。
        adjustment: |
          世界以為你是水。練習做一次明確的拒絕——讓自己不被流走。

# ---------------------------------------------------------------------
# 行星 × 宮位重點組合（v1 選擇性，老師可擴充）
# ---------------------------------------------------------------------
# 不全列 10 行星 × 12 宮位 = 120 種組合。v1 先給最常被問的關鍵組合，
# 其他可由老師根據 sun_signs / moon_signs / houses 的單獨意義組合詮釋。
# ---------------------------------------------------------------------
planet_in_house:
  "金星_5":
    label: "金星在第五宮"
    teaser: |
      金星落 5 宮的人，戀愛 = 創作。你愛得有戲劇性，也容易把愛情當靈感來源。問題是你會把每一段感情當作品經營，劇本一結束就難留下來。
    note: |
      重點題目：學會把愛從表演轉為陪伴。

  "金星_7":
    label: "金星在第七宮"
    teaser: |
      金星落 7 宮是「關係本身就是你的禮物」。你天然懂得對方需要什麼，但你也容易把對方的需要當成自己的。
    note: |
      重點題目：練習在親密中保留獨立。

  "火星_1":
    label: "火星在第一宮"
    teaser: |
      火星落 1 宮的人，第一印象「衝、敢、不囉嗦」。你的存在感本身就是行動，但你也容易在沒必要的場合釋放戰鬥能量。
    note: |
      重點題目：學會分辨「該戰」與「不必戰」的時機。

  "火星_8":
    label: "火星在第八宮"
    teaser: |
      火星落 8 宮，你對權力、信任、性、共享資源都有強烈的反應。你不會逃避深處，但你也容易陷入控制／被控制的權力遊戲。
    note: |
      重點題目：把對深度的渴望從「控制」轉為「真正交付」。

  "土星_10":
    label: "土星在第十宮"
    teaser: |
      土星落 10 宮的人，事業是修行——晚熟、需要承擔、最後會留下成就。但 30 歲前你常會覺得「為什麼別人這麼輕鬆」。
    note: |
      重點題目：相信長線。你的果在 35 歲後才慢慢結。

  "月亮_4":
    label: "月亮在第四宮"
    teaser: |
      月亮落 4 宮是「家就是你的核心引擎」。你被家族滋養也被家族綁住。處理好家的功課，整個人會輕很多。
    note: |
      重點題目：辨識「我的家」與「原生家庭」的差別，建立自己的家。

  "海王星_12":
    label: "海王星在第十二宮"
    teaser: |
      海王落 12 宮的人，靈性、夢、潛意識都特別活躍。你很容易共感別人的痛，也容易被集體無意識淹沒。
    note: |
      重點題目：建立每天的獨處儀式，否則邊界會消融。

  "冥王星_8":
    label: "冥王星在第八宮"
    teaser: |
      冥王落 8 宮是「你會經歷一次徹底的死亡與重生」。可能是一段關係的結束、一場巨大的失去、一次深層的揭穿。但你會活下來，而且更深。
    note: |
      重點題目：不要逃避該結束的事。死亡是你進化的入口。

