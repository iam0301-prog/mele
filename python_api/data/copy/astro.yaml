# =====================================================================
# Mele 命理媒介中心 — 西洋占星文案
# =====================================================================
# v1 範圍：
#   - sun_signs       : 太陽 × 12 星座（核心自我 / 生命主軸）
#   - moon_signs      : 月亮 × 12 星座（情緒底色 / 安全感模式）
#   - rising_signs    : 上升 × 12 星座（外顯 / 與世界互動的窗口）
#   - houses          : 12 宮位簡介（哪一塊人生領域）
#   - planet_in_house : 重點行星 × 宮位組合（選擇性，不全列）
#
# 客戶端 (/tools/astro) 使用 teaser.friend
# 老師後台 voice tab 切換 full.master
#
# YAML key 體例：
#   - 星座：中文名稱（牡羊 / 金牛 / ...）
#   - 宮位：序號（1~12，整數）
#
# Voice 原則：master = 溫暖長者，敢說重話、有時刻、有暗面、有立場
# =====================================================================

schema_version: 1

# ---------------------------------------------------------------------
# 太陽星座（核心自我）—— 12 個
# ---------------------------------------------------------------------
sun_signs:
  "牡羊":
    element: "火"
    quality: "本位"
    teaser:
      friend: |
        牡羊太陽是「我要、我衝、我先」。問題不在你快，是你常常衝過頭才回頭找隊友。30 歲後你會學會：開頭的人不必每次都跑第一個。
    full:
      master:
        core: |
          純粹的「我」、開創、行動先於思考。生命題目是學會領導不必獨行。
        shadow: |
          急躁、自我中心、用「我直接」當不顧及別人感受的擋箭牌。
        relationship: |
          愛情裡會主動，但易在「贏到」之後失去興趣。需要會踩煞車的伴侶。
        growth: |
          這個月做一件「等別人先動」的事。看自己會不會受不了——通常會，但練。

  "金牛":
    element: "土"
    quality: "固定"
    teaser:
      friend: |
        金牛太陽是「我擁有、我感受、我穩住」。問題不在你慢，是你慢到把該放的也抓著。30 歲後你會學會：真正的安全感不是擁有多少，是知道失去也活得下去。
    full:
      master:
        core: |
          身體性、物質性、對舒適與美的天然嚮往。生命題目是學會擁有與放手並存。
        shadow: |
          固執、佔有慾、把改變視為威脅。把「我喜歡這樣」當不調整的理由。
        relationship: |
          忠誠且穩定，但抗拒對方的成長。需要願意一起變化的伴侶。
        growth: |
          這個月主動放下一個你佔著很久但不再需要的東西。物理或關係都可。

  "雙子":
    element: "風"
    quality: "變動"
    teaser:
      friend: |
        雙子太陽是「我連結、我傳遞、我好奇」。問題不在你跳，是你常常什麼都接但什麼都不深。30 歲後你會學會：深度不是死板，是允許自己在一件事上停下來。
    full:
      master:
        core: |
          語言、訊息流動、心智靈活。生命題目是學會在多元中選擇深度。
        shadow: |
          淺嚐輒止、用幽默逃避深入、社交廣但缺真實連結。
        relationship: |
          能聊一輩子但難承諾。需要懂得「無聊也是親密」的伴侶。
        growth: |
          這個月選一個主題，深做 30 天。不換、不分心、不找新刺激。

  "巨蟹":
    element: "水"
    quality: "本位"
    teaser:
      friend: |
        巨蟹太陽是「我滋養、我守護、我感受家」。問題不在你軟，是你軟到把該說的話都吞下去。30 歲後你會學會：真正的家是你敢說真話的地方，不是你忍最多的地方。
    full:
      master:
        core: |
          情感、歸屬、養育力。生命題目是學會照顧自己跟照顧別人並重。
        shadow: |
          情感勒索、過度保護、用「我是為了你好」綁住對方。
        relationship: |
          深情但黏、愛恨記得久。需要懂得回應你情緒但不被淹沒的伴侶。
        growth: |
          這個月對家人說一句你忍了很久沒說的真話。不解釋、不道歉。

  "獅子":
    element: "火"
    quality: "固定"
    teaser:
      friend: |
        獅子太陽是「我發光、我創造、我被看見」。問題不在你想被看見，是你把所有不被看見的時刻都當成失敗。30 歲後你會學會：暗下來不是消失，是換光源。
    full:
      master:
        core: |
          創造、表達、心的慷慨。生命題目是學會從「需要被看見」進化為「願意看見別人」。
        shadow: |
          自我膨脹、要掌聲、把忽視當侮辱、容易被諂媚迷惑。
        relationship: |
          愛得熱烈但要求崇拜。需要欣賞你又不卑微的伴侶。
        growth: |
          這個月把一次該屬於你的掌聲，主動讓給身邊一個一直被你蓋過光的人。

  "處女":
    element: "土"
    quality: "變動"
    teaser:
      friend: |
        處女太陽是「我分析、我精進、我服務」。問題不在你細，是你細到連別人的不完美都讓你受不了。30 歲後你會學會：完美是空集合，活著的都不完美。
    full:
      master:
        core: |
          辨識力、實用、服務精神。生命題目是學會接受「夠好」就是完美。
        shadow: |
          過度批評、為他人焦慮過頭、把「我是為了把事做好」當不放手的擋箭牌。
        relationship: |
          忠誠且願意付出，但易嘮叨。需要承受得住你細節又不被改造的伴侶。
        growth: |
          這個月對一件不完美的事說「夠好了」並交出去。不修、不補、不再優化。

  "天秤":
    element: "風"
    quality: "本位"
    teaser:
      friend: |
        天秤太陽是「我平衡、我關係、我和諧」。問題不在你會圓，是你圓到自己想要什麼都不知道。30 歲後你會學會：和諧不是討好，是真實地不同意之後仍能共處。
    full:
      master:
        core: |
          關係、美感、公平。生命題目是學會在和諧中保留自我立場。
        shadow: |
          決策困難、討好、用「我為了大家好」掩飾不敢得罪人。
        relationship: |
          擅長關係但易為了對方失去自己。需要不會讓你消失的伴侶。
        growth: |
          這個月做三個決定不問別人意見。錯了也好，至少是你的決定。

  "天蠍":
    element: "水"
    quality: "固定"
    teaser:
      friend: |
        天蠍太陽是「我深入、我蛻變、我穿透假象」。問題不在你深，是你常把深當成防備他人的城牆。30 歲後你會學會：深的人也可以被看見，被看見不是被傷害。
    full:
      master:
        core: |
          心理深度、轉化、權力與信任。生命題目是學會把控制換成親密。
        shadow: |
          猜疑、報復、用沉默懲罰、把「我看穿你」當不真實連結的擋箭牌。
        relationship: |
          愛得徹底也痛得徹底。需要承受得住你陰影又不被吞掉的伴侶。
        growth: |
          這個月對一個信任的人說一件你最不想被看見的事。練習被看見不會死。

  "射手":
    element: "火"
    quality: "變動"
    teaser:
      friend: |
        射手太陽是「我擴張、我自由、我尋找意義」。問題不在你飛，是你常常把承諾當作牢籠。30 歲後你會學會：真正的自由不是不被綁，是選擇被什麼綁。
    full:
      master:
        core: |
          擴張、信念、跨界。生命題目是學會在自由中承諾。
        shadow: |
          逃避深入、好為人師、用「我只是直話直說」傷人。
        relationship: |
          熱情但怕被困住。需要願意一起冒險又不會跟丟的伴侶。
        growth: |
          這個月對一件你一直保留退路的事下決心承諾 6 個月。

  "摩羯":
    element: "土"
    quality: "本位"
    teaser:
      friend: |
        摩羯太陽是「我建造、我承擔、我留下成就」。問題不在你扛，是你扛到忘了人生不是 KPI。30 歲後你會學會：成就如果沒有人陪你慶祝，就只是疲倦。
    full:
      master:
        core: |
          結構、責任、長線經營。生命題目是學會在攀登中允許享受。
        shadow: |
          冷硬、控制、用工作逃避情感、把成就當自我證明。
        relationship: |
          忠誠負責但情感壓抑。需要願意陪你軟下來的伴侶。
        growth: |
          這個月安排一次「沒目的」的休假。不工作、不規劃、不證明自己有效率。

  "水瓶":
    element: "風"
    quality: "固定"
    teaser:
      friend: |
        水瓶太陽是「我獨立、我創新、我關心眾人」。問題不在你特別，是你常把獨特當不必跟人深的擋箭牌。30 歲後你會學會：關心人類很容易，關心一個具體的人才難。
    full:
      master:
        core: |
          創新、群體意識、未來感。生命題目是學會從理念走到關係。
        shadow: |
          疏離、為了不同而不同、用「我這人比較冷」逃避親密。
        relationship: |
          能成為朋友但難變愛人。需要懂你抽離又能拉你回來的伴侶。
        growth: |
          這個月對一個具體的人做一次具體的關心。不是想法、不是理論。

  "雙魚":
    element: "水"
    quality: "變動"
    teaser:
      friend: |
        雙魚太陽是「我感受、我消融、我與更大的東西連線」。問題不在你軟，是你常分不清自己跟別人的感受。30 歲後你會學會：感受深的人最需要的不是逃避，是邊界。
    full:
      master:
        core: |
          靈性、慈悲、創造力。生命題目是學會在融合中保持自己。
        shadow: |
          逃避現實、扮演受害者、把「我太敏感」當不負責任的擋箭牌。
        relationship: |
          能與對方融為一體但也易迷失自我。需要會把你拉回來的伴侶。
        growth: |
          這個月對一段消耗你的關係 / 場域劃下明確界線。不解釋、不道歉。

# ---------------------------------------------------------------------
# 12 宮位框架（行星落入哪個宮 = 在哪個人生領域顯化）
# ---------------------------------------------------------------------
houses:
  1:
    domain: "自我 / 外貌 / 起手式"
    teaser: |
      第一宮是「你給世界的第一印象」。重點不是別人怎麼看你，是你準備怎麼出場。
    note: |
      重要落點：上升星座 / 任何在 1 宮的行星都會強烈塑造個人外顯氣質。
  2:
    domain: "金錢 / 價值 / 擁有"
    teaser: |
      第二宮不只是錢——是你定義「什麼有價值」的方式。錢只是其中一種形式。
    note: |
      行星落 2 宮：金錢觀、財務模式、自我價值的依託。
  3:
    domain: "溝通 / 學習 / 手足 / 短程移動"
    teaser: |
      第三宮是日常的訊息流。你怎麼說話、怎麼學、怎麼跟近距離的人互動。
    note: |
      水星天然主管。落 3 宮的行星影響表達與心智節奏。
  4:
    domain: "家 / 根 / 內在的安全感"
    teaser: |
      第四宮是地基——你從哪裡來、你的「家」如何形塑你內在最深的部分。
    note: |
      月亮天然主管。4 宮行星往往跟家族議題、原生創傷有關。
  5:
    domain: "創造 / 戀愛 / 孩子 / 自我表達"
    teaser: |
      第五宮是「我把自己活出來」的領域——玩、愛、創作、不必有用的事。
    note: |
      太陽天然主管。5 宮強的人需要被看見的舞台。
  6:
    domain: "工作 / 健康 / 日常服務"
    teaser: |
      第六宮是日復一日的微觀——你怎麼工作、怎麼照顧身體、怎麼建立習慣。
    note: |
      水星 / 處女主題。6 宮行星揭示日常壓力與身體訊號模式。
  7:
    domain: "夥伴 / 婚姻 / 一對一關係"
    teaser: |
      第七宮是「對面的人」——你選擇的伴侶其實常是你看不見的自己。
    note: |
      金星天然主管。7 宮行星揭示親密關係的吸引模式與課題。
  8:
    domain: "深度 / 死亡與重生 / 共享資源 / 性"
    teaser: |
      第八宮是不能用日光談的東西——親密深處、轉化、共同擁有的權力與金錢。
    note: |
      天蠍 / 冥王主題。8 宮行星揭示禁忌、控制議題、深層蛻變。
  9:
    domain: "哲學 / 高等教育 / 遠方 / 信念"
    teaser: |
      第九宮是「擴張的視野」——你相信什麼、你願意走多遠去找答案。
    note: |
      木星天然主管。9 宮行星影響信念系統與跨文化經驗。
  10:
    domain: "事業 / 名聲 / 社會角色"
    teaser: |
      第十宮是世界看見你的方式——不是你的工作，是你的「社會位置」。
    note: |
      摩羯 / 土星主題。MC（天頂）落點往往指示天職方向。
  11:
    domain: "朋友 / 社群 / 願景"
    teaser: |
      第十一宮是你的「部落」——什麼樣的群體跟你共振、你為什麼樣的未來努力。
    note: |
      水瓶主題。11 宮行星揭示同溫層與長期願景的形狀。
  12:
    domain: "潛意識 / 隱藏 / 靈性 / 自我消融"
    teaser: |
      第十二宮是最深的暗處——夢、上癮、靈感、需要獨處才能聽見的聲音。
    note: |
      雙魚 / 海王主題。12 宮行星揭示集體無意識與療癒功課。

# moon_signs 與 rising_signs 將於後續 batch 補上
moon_signs: {}
rising_signs: {}
planet_in_house: {}
