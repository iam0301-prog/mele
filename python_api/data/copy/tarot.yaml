# =====================================================================
# Mele 命理媒介中心 — 塔羅 22 大牌解讀文案
# =====================================================================
# v1 範圍：22 張大阿爾克那（Major Arcana）正逆位 voice
#
# 客戶端 (/tools/tarot) 使用 teaser.friend
# 老師後台 voice tab 切換 full.master
#
# YAML key = name_zh（對應 python_api/data/tarot.json 的中文名稱）
#
# 每張牌六區塊：
#   upright_core   — 正位核心訊息（這張牌正面浮現時要說什麼）
#   upright_focus  — 正位行動建議（接下來該做什麼）
#   reversed_core  — 逆位核心訊息（能量阻塞或反向時的處境）
#   reversed_shadow— 逆位陰影（要小心的暗面）
#   situation      — 出現此牌代表問卜者正在的處境
#   inquiry        — 給客戶反問的一個問句
#
# Voice 原則：master = 溫暖長者，敢說重話、不打安全牌、有立場
# =====================================================================

schema_version: 1

cards:
  "愚人":
    arcanum: 0
    teaser:
      friend: |
        愚人不是不懂事——是還沒被「應該」綁住。這張牌出現，代表你現在最需要的不是更多計畫，是先邁出那一步。不知道結果沒關係，知道結果才出發的人，通常哪裡都到不了。
    full:
      master:
        upright_core: |
          純粹的起點。信任直覺、相信過程、敢於進入未知。
        upright_focus: |
          這週啟動一件「不知道結果」的事。不要等資訊齊全、不要等別人點頭。
        reversed_core: |
          猶豫、停在原地、過度評估風險。把「我還沒準備好」當成不行動的理由。
        reversed_shadow: |
          逃避責任的天真。用「我還在探索」掩蓋不想承擔。
        situation: |
          人生岔路口。所有條件都不確定，但其實只欠你說「好，我來」。
        inquiry: |
          如果你知道不會有人來救你，你還會出發嗎？

  "魔術師":
    arcanum: 1
    teaser:
      friend: |
        魔術師代表你手邊資源比你想像的多。問題不是「我有沒有」，而是「我會不會用」。這張牌出現，是宇宙在問你：你那些一直壓著沒動用的本事，要不要拿出來？
    full:
      master:
        upright_core: |
          整合所有元素的能力。意志力、技藝、表達、行動全到位。
        upright_focus: |
          盤點手邊資源（人脈、技能、工具），這週至少啟動一個被你閒置的能力。
        reversed_core: |
          有能力卻不出手。把本事藏起來、被自我懷疑拖住。
        reversed_shadow: |
          操弄、玩弄信任、把技巧用在錯的地方。
        situation: |
          時機與資源都齊備，卡的是「敢不敢承認自己準備好了」。
        inquiry: |
          如果你真的承認你已經夠強了，你會先做哪件事？

  "女祭司":
    arcanum: 2
    teaser:
      friend: |
        女祭司不講話——她讓你聽見自己一直假裝沒聽見的東西。這張牌出現，是叫你停下來。不是叫你想，是叫你聽：那個你一直壓住的直覺，這次別蓋過去了。
    full:
      master:
        upright_core: |
          內在智慧、潛意識訊息、直覺浮現。答案在你裡面，不在外面。
        upright_focus: |
          這週留 30 分鐘獨處不滑手機。讓那個你一直壓著的感受先說話。
        reversed_core: |
          忽略直覺、過度依賴邏輯、把感受合理化掉。
        reversed_shadow: |
          神祕主義包裝逃避、用「冥想中」當不面對現實的擋箭牌。
        situation: |
          表面問題下面有更深的問題。你早就知道答案，只是還不想承認。
        inquiry: |
          你一直假裝沒聽見的那個聲音，這次說了什麼？

  "皇后":
    arcanum: 3
    teaser:
      friend: |
        皇后是豐盛的象徵——但豐盛不是擁有很多，是知道自己已經夠了。這張牌出現，代表你需要停止追逐，回頭看你已經滋養出來的東西。
    full:
      master:
        upright_core: |
          豐盛、創造、滋養、感性。生命力自然湧出，不必逼自己生產。
        upright_focus: |
          這週做一件純粹「享受」的事——吃、睡、走路、創作，不為交付。
        reversed_core: |
          過度給予而枯竭、創造力被壓抑、與身體失聯。
        reversed_shadow: |
          用「為了大家好」綁架自己，把照顧別人當成不照顧自己的藉口。
        situation: |
          你一直在生產，但忘了讓自己被滋養。源頭乾了再給就是消耗。
        inquiry: |
          上一次你純粹為了享受而做的事是什麼時候？

  "皇帝":
    arcanum: 4
    teaser:
      friend: |
        皇帝不是壓你——是叫你扛起來。這張牌出現，代表你內在那個「沒人能幫我做決定」的時刻來了。要嘛你坐上那個位置，要嘛繼續被別人安排。
    full:
      master:
        upright_core: |
          結構、秩序、權威、長期承擔。把混亂變成可運作的系統。
        upright_focus: |
          這週對一件懸而未決的事做出最終決定。不再開會、不再諮詢，定了就走。
        reversed_core: |
          失控、結構崩塌、無法承擔。或反過來：僵硬獨裁。
        reversed_shadow: |
          用「規則」壓制柔軟、把控制當成負責、剝奪別人選擇。
        situation: |
          一個需要你站到主位的局面。坐不上去就沒人坐。
        inquiry: |
          如果今天必須你做決定，你會怎麼決？

  "教皇":
    arcanum: 5
    teaser:
      friend: |
        教皇代表傳承——某個比你大的系統，這次想透過你說話。可能是家族、傳統、信仰、某位老師。問題不是要不要接住，是你願不願意承認自己其實還沒長大到不需要老師。
    full:
      master:
        upright_core: |
          師承、體制、共同信念。透過既有結構找到自己的位置。
        upright_focus: |
          這週主動聯繫一位你尊敬但久未連絡的師長或前輩。問一個你卡住的問題。
        reversed_core: |
          反叛、拒絕傳統、自立門戶。或反過來：被體制困住不敢離開。
        reversed_shadow: |
          用「我要走自己的路」當不接受指導的藉口；或用「老師說」逃避思考。
        situation: |
          一個關於「跟誰學」「進哪個系統」的抉擇。
        inquiry: |
          你現在最需要的，是學一個方法，還是離開一個系統？

  "戀人":
    arcanum: 6
    teaser:
      friend: |
        戀人不只是愛情——是你必須選邊站的時刻。這張牌出現，代表逃避選擇本身就是一個選擇。不選，命運會替你選，而通常選得不會比較好。
    full:
      master:
        upright_core: |
          關係深化、價值對齊、必須做出選擇。心與頭腦達成共識。
        upright_focus: |
          這週把一個你一直拖延的「要不要」攤開來看。給自己一週內決定。
        reversed_core: |
          失衡、價值衝突、被迫選擇、誘惑與責任的拉扯。
        reversed_shadow: |
          用「我還在感受」拖延承諾；或在三角關係中扮演受害者。
        situation: |
          兩條路擺在面前，選哪一條都會失去另一條的可能。
        inquiry: |
          哪一個選擇，是十年後的你會感謝今天的你做的？

  "戰車":
    arcanum: 7
    teaser:
      friend: |
        戰車不是衝——是你要同時駕馭兩股相反的力量往前走。這張牌出現，代表你已經有能力，但還在學怎麼讓內在矛盾不互相抵消。
    full:
      master:
        upright_core: |
          意志、控制、突破障礙。把對立能量整合成推進力。
        upright_focus: |
          這週設定一個 30 天的明確目標。每天回報自己——不是回報別人。
        reversed_core: |
          失控、失焦、被情緒拉著走。或反過來：硬撐到崩塌。
        reversed_shadow: |
          把「我意志強」當成不聽身邊人勸告的藉口。
        situation: |
          需要把分散的精力收攏成一股力量的時刻。
        inquiry: |
          你正在用力推的那輛車，真的還要往那個方向去嗎？

  "力量":
    arcanum: 8
    teaser:
      friend: |
        力量不是制伏野獸——是和牠成為朋友。這張牌出現，代表你正在學「不用對抗也能贏」的本事。最強的人不是最硬的，是最有溫度的。
    full:
      master:
        upright_core: |
          柔性力量、勇氣、自我接納。用愛馴服恐懼，而非用力壓制。
        upright_focus: |
          這週對你內在最不喜歡的那一面說一句「我看見你了」。不要壓、不要修。
        reversed_core: |
          自我懷疑、被情緒淹沒、躲開挑戰。
        reversed_shadow: |
          虛假的堅強、不允許自己脆弱、把「我可以」當成不求救的擋箭牌。
        situation: |
          需要面對的不是外面的挑戰，是內在那頭你一直餵養的恐懼。
        inquiry: |
          如果你不需要假裝強，你會先承認哪件事讓你害怕？

  "隱者":
    arcanum: 9
    teaser:
      friend: |
        隱者不是逃——是知道自己這段路必須一個人走。這張牌出現，代表你需要一段安靜。不是消失，是把外面的雜音關掉，聽見自己原本的聲音。
    full:
      master:
        upright_core: |
          內省、退場、智慧。在獨處中找到方向。
        upright_focus: |
          這週安排一天「對外靜音」——不開會、不回訊息、不被找。
        reversed_core: |
          孤立、過度退縮、與外界失聯。或反過來：拒絕獨處不敢面對自己。
        reversed_shadow: |
          用「我需要時間」拖延處理該處理的關係。
        situation: |
          一個你必須暫時離開人群，才能聽見自己的階段。
        inquiry: |
          如果這週沒人聯絡你，你會做什麼？

  "命運之輪":
    arcanum: 10
    teaser:
      friend: |
        命運之輪不是叫你等運氣——是告訴你，現在轉動的力量比你大。這張牌出現，代表你能做的不是控制，是在輪子轉到對的位置時，跳上去。
    full:
      master:
        upright_core: |
          轉折、機緣、超越個人意志的力量正在運作。
        upright_focus: |
          這週對一個「突然出現」的機會說「好」。不要過度評估，先進去再說。
        reversed_core: |
          卡住、被命運壓著、感覺無力。或反過來：抗拒變化。
        reversed_shadow: |
          用「時機未到」當不開始的理由；或用「都是命」放棄主動。
        situation: |
          一個你控制不了的轉變正在發生。重點不是擋，是順勢調整位置。
        inquiry: |
          這個轉變如果是禮物，它要送你什麼？

  "正義":
    arcanum: 11
    teaser:
      friend: |
        正義不是好人有好報——是該還的會還、該算的會算。這張牌出現，代表你之前做的某件事，現在到了結帳的時候。可能是收穫、可能是負債，重點是不會再拖了。
    full:
      master:
        upright_core: |
          因果、平衡、誠實面對。所有行為都會回到自己身上，這次來算。
        upright_focus: |
          這週把一筆「未了的帳」清掉——可能是道歉、退錢、把該說的話說出口。
        reversed_core: |
          不公平、逃避責任、推卸給命運或他人。
        reversed_shadow: |
          用「世界不公平」當作不負責任的擋箭牌。
        situation: |
          一個結算的時刻。不是別人在審判你，是你必須對自己誠實。
        inquiry: |
          你欠誰一個交代？包括欠自己的那個。

  "倒吊人":
    arcanum: 12
    teaser:
      friend: |
        倒吊人不是受困——是主動換一個角度看事情。這張牌出現，代表你卡住的原因是視角太熟悉了。停一下、倒過來看，原本以為的問題可能根本不是問題。
    full:
      master:
        upright_core: |
          換視角、暫停、犧牲短期換長期、靈感從停滯中浮現。
        upright_focus: |
          這週對一件你想推進的事按下暫停。什麼都不做，看清楚再說。
        reversed_core: |
          僵化、徒勞的犧牲、為錯的人事物消耗自己。
        reversed_shadow: |
          用「我在等時機」拖延；或用「我犧牲了這麼多」勒索身邊的人。
        situation: |
          越推越卡的階段。重點不是更用力，是放下、換角度。
        inquiry: |
          如果這個局勢是顛倒的，你會看到什麼你原本看不見的？

  "死神":
    arcanum: 13
    teaser:
      friend: |
        死神不是真的死——是一個階段結束了。這張牌出現，代表有一個你還抱著不放的東西，已經沒有生命了。鬆手不是失去，是給新東西騰出位置。
    full:
      master:
        upright_core: |
          結束、轉化、徹底放下。舊的不死，新的不來。
        upright_focus: |
          這週主動結束一段已經沒有生命力的事——關係、習慣、工作、群組。
        reversed_core: |
          拒絕結束、強留將逝去之物、抗拒改變。
        reversed_shadow: |
          把「我們還能挽救」當不放手的藉口，明知是耗盡也不願承認。
        situation: |
          一個必須結束的階段，越早承認越好。拖只會讓告別更痛。
        inquiry: |
          有哪件事，你其實知道它已經死了，只是還沒敢辦喪禮？

  "節制":
    arcanum: 14
    teaser:
      friend: |
        節制不是禁慾——是知道怎麼調配比例。這張牌出現，代表你最近在某件事上太極端了。不是叫你變淡，是叫你找到那個剛剛好的點。
    full:
      master:
        upright_core: |
          調和、中道、耐心整合對立。把兩極混合成可飲用的東西。
        upright_focus: |
          這週對一件你太用力的事減半，太消極的事加倍。找到 50/50。
        reversed_core: |
          失衡、過度、衝動。把所有時間精力都倒進一件事。
        reversed_shadow: |
          用「我是完美主義」掩蓋無法停手；或用「順其自然」逃避該調整的事。
        situation: |
          某個面向太多、某個面向太少。要的不是更努力，是重新配比。
        inquiry: |
          這件事如果只能花現在一半的力氣，你會留下哪一半？

  "惡魔":
    arcanum: 15
    teaser:
      friend: |
        惡魔不是壞——是你以為解不開的鎖，鑰匙其實在你口袋裡。這張牌出現，代表有一段你說「我沒辦法」的關係或習慣，其實你一直有辦法，只是怕走出去之後要面對的東西。
    full:
      master:
        upright_core: |
          上癮、執著、被自己的渴望綁住。鎖是自己鎖上的。
        upright_focus: |
          這週對一個「我戒不掉」的東西做 7 天斷捨——只是試試看自己其實可以。
        reversed_core: |
          鬆綁、解脫、看清依賴。
        reversed_shadow: |
          假裝解脫但又偷偷回頭；用「我已經放下」自我欺騙。
        situation: |
          一個你說「我沒選擇」的處境。實際上你有，只是還不想付代價。
        inquiry: |
          這個讓你痛苦的東西，給了你什麼好處，讓你捨不得走？

  "高塔":
    arcanum: 16
    teaser:
      friend: |
        高塔倒了不是災難——是建在錯的地基上的東西，本來就會倒。這張牌出現，代表你會經歷一個崩潰。痛，但崩掉的是不該存在的，重建才有空間。
    full:
      master:
        upright_core: |
          突發性瓦解、舊結構崩塌、真相浮出。
        upright_focus: |
          這週不要強行修補正在崩塌的事。讓它倒完，再看廢墟裡有什麼。
        reversed_core: |
          逃避崩塌、緊抓搖搖欲墜的結構、延後不可避免的破局。
        reversed_shadow: |
          假裝沒事、用粉飾掩蓋裂縫，最後崩塌時更慘。
        situation: |
          某件事本來就建在錯的基礎上。它崩了，是好事——只是一開始不像。
        inquiry: |
          如果這個崩塌是必要的，它在幫你清理什麼？

  "星星":
    arcanum: 17
    teaser:
      friend: |
        星星不是許願——是經歷高塔之後，你發現自己沒被毀掉，反而更安靜了。這張牌出現，代表你正在被療癒。不用做什麼，讓光照進來就好。
    full:
      master:
        upright_core: |
          希望、療癒、純粹、與更大的東西重新連線。
        upright_focus: |
          這週做一件「沒有目的」的事——看星空、走路、寫字。讓自己空著。
        reversed_core: |
          失去信心、感覺被遺棄、夢想破碎。
        reversed_shadow: |
          用「我什麼都不期待了」當避免再受傷的盔甲。
        situation: |
          一段重新長出信任的時期。不快，但很真。
        inquiry: |
          如果你又敢相信一件事，會是什麼？

  "月亮":
    arcanum: 18
    teaser:
      friend: |
        月亮不是讓你迷路——是讓你看清楚原來自己一直走在迷霧裡。這張牌出現，代表你的恐懼、夢、潛意識在說話。不舒服，但這次不要急著解釋掉。
    full:
      master:
        upright_core: |
          潛意識浮現、夢、恐懼、未知中前行。
        upright_focus: |
          這週記錄三個夢、或三件「我說不上為什麼害怕」的感受。不分析，先寫下。
        reversed_core: |
          迷霧散去、看清真相、不再被恐懼牽走。
        reversed_shadow: |
