# =====================================================================
# Mele 命理媒介中心 — 八字解讀文案
# =====================================================================
# v1 範圍：10 天干日主 × (客戶 teaser + 老師 master full)
# 之後再補：12 地支、五行平衡、月令格局、大運流年
#
# 客戶端 (/tools/bazi) 使用 teaser.friend
# 老師後台 voice tab 切換 full.master
#
# Voice 原則：master = 溫暖長者，敢說重話、有時刻、有暗面、有立場
# =====================================================================

schema_version: 1

# 10 天干日主文案
day_masters:
  "甲":
    teaser:
      friend: |
        甲木日主就像參天大樹——你天生有方向、敢頂風長。問題不在你長得快，是你看不到別人也在長。30 歲前你會覺得世界欠你機會，30 歲後你會發現自己其實是把人擋在樹蔭下。
    full:
      master:
        core: |
          甲木如大樹。生而向上，方向感是命。
        shadow: |
          太剛直不轉彎。看不見別人的速度。把「我是為大家好」當不解釋的理由。
        milestones:
          - "28-32 歲：第一次「太剛被風吹斷」的經驗"
          - "35-40 歲：學會「轉彎不是妥協」"
          - "40+：若仍硬撐，會在事業中段卡住"
        inquiries:
          - "最近一次你堅持卻被身邊人放棄你？"
          - "你願意讓人快過你嗎？"
          - "你最近一次承認自己錯了是何時？"
        crosses:
          - "走金運：剋制過強，要小心人際"
          - "走火運：表達放大，名聲機會多但易爭"
          - "走水運：滋潤舒展期，學新東西最快"
        focus: |
          一件事「主動讓位給他人」，這週做。讓樹蔭挪一下，看誰能在那個位置長出來。

  "乙":
    teaser:
      friend: |
        乙木日主像藤花——你柔，但你也活著。問題不在你彎，是你彎太多次後忘了自己原本想長什麼方向。30 歲後你會發現所有人都用得到你，但沒人記得你也需要被支撐。
    full:
      master:
        core: |
          乙木如藤蔓。柔韌、會繞、會纏，找縫隙生長。
        shadow: |
          太會配合而失去主軸。被需要的時候很在；不被需要時就空。
        milestones:
          - "20-28 歲：到處攀附還沒選定支柱"
          - "30+：第一次認真選定「我要往哪長」"
          - "40+：若仍配合所有人，會出現存在感稀薄"
        inquiries:
          - "你最近一次主動拒絕誰？"
          - "拿掉所有要配合的對象，你想做什麼？"
          - "誰是你願意纏一輩子的支柱？"
        crosses:
          - "走木運：自身強，可獨立發展"
          - "走金運：易被人剪枝，注意人際"
          - "走土運：扎根機會，安頓資源"
        focus: |
          一件「不配合誰」的事，這週做。讓自己長一段沒有支柱的時間，看會發生什麼。

  "丙":
    teaser:
      friend: |
        丙火日主像太陽——你照亮大家，是天生發光體。但你會發現一件事：太陽要承擔讓每個人都看見的責任，沒人問過太陽今天累不累。30 歲後你會發現自己其實怕暗，因為暗下來時你就不知道自己是誰。
    full:
      master:
        core: |
          丙火如太陽。外放、照亮、帶動氣氛，存在感強。
        shadow: |
          燃燒過度耗盡自己。被掌聲綁架。怕暗下來，因為沒了光不知道自己是誰。
        milestones:
          - "20-30 歲：站在舞台中央的甜頭"
          - "30-38 歲：第一次承認「我累了」"
          - "40+：若仍只發光，會出現深度倦怠"
        inquiries:
          - "你最近一次允許自己「不發光」？"
          - "沒人看的時候，你還是你嗎？"
          - "誰在你暗下來時還願意陪你？"
        crosses:
          - "走水運：剋制大但能滋養成長"
          - "走木運：燃料充足，活躍期"
          - "走金運：照亮金屬有光但容易過熱"
        focus: |
          一天「不為別人發光」——關手機、不回訊息、不回應任何期待。看自己暗下來時是誰。

  "丁":
    teaser:
      friend: |
        丁火日主像燭火——你細膩、敏銳，能照亮細節。但你會發現一件事：你照得到別人，卻常常被自己的情緒淹沒。30 歲後你會發現你的光需要被珍惜的人陪伴，不是任何人都能在你身邊。
    full:
      master:
        core: |
          丁火如燭光。細膩、敏感、能照細節，溫度比強度重要。
        shadow: |
          容易被情緒淹沒。光小卻消耗自己快。在錯的人身邊會被吹熄。
        milestones:
          - "20-28 歲：累積敏銳但情緒起伏大"
          - "30+：學會「不是每個人都值得我為他點亮」"
          - "35+：若仍亂照亮，會慢性耗竭"
        inquiries:
          - "誰在你身邊讓你發光，誰讓你熄滅？"
          - "你最近一次替錯的人付出？"
          - "你的敏感保護了誰，又消耗了誰？"
        crosses:
          - "走木運：燃料充足，光更穩"
          - "走水運：易熄滅，要保護自己"
          - "走金運：精細表現好的時期"
        focus: |
          列出「會吹熄你的人」名單。這週減少跟其中一個人的接觸，看自己會不會比較亮。

  "戊":
    teaser:
      friend: |
        戊土日主像高山——你穩、你扛得住事情。問題不在你扛，是你扛太多。30 歲後你會發現大家都把你當依靠，但沒人問過山累不累。
    full:
      master:
        core: |
          戊土如高山。穩重、承接力強，是天然的支柱。
        shadow: |
          扛太多不說。被當成理所當然的依靠。固執而不自覺。
        milestones:
          - "25-32 歲：第一次「我也需要被照顧」"
          - "30-38 歲：發現「穩」也會變「僵」"
          - "40+：若仍硬扛，會出現腰背或消化系統訊號"
        inquiries:
          - "你最近一次承認「我撐不住了」是何時？"
          - "誰會主動扶你，不只是依靠你？"
          - "你最固執不肯改的是什麼？"
        crosses:
          - "走木運：剋制大，承受壓力多"
          - "走水運：滋潤期，資源流動"
          - "走火運：扎根穩，學習新事最佳"
        focus: |
          一件你扛了很久的事，這週主動講出「我需要幫忙」。不要等到山崩。

  "己":
    teaser:
      friend: |
        己土日主像田園——你包容、會養人。但你會發現一件事：你養了很多人事物，自己卻常被踩在腳下。30 歲後你會發現包容若沒有界線，就只是被消耗。
    full:
      master:
        core: |
          己土如田園。包容、養育、能成事，但要被珍惜。
        shadow: |
          替別人收拾過頭。包容變消耗。沒人尊重你的界線，因為你從沒劃過。
        milestones:
          - "童年起：早早成為家裡的「收拾者」"
          - "30+：第一次劃下界線的痛苦"
          - "40+：若仍包容過頭，會出現深度倦怠"
        inquiries:
          - "你最近一次替誰收拾爛攤子？"
          - "你界線在哪裡？對方知道嗎？"
          - "誰會尊重你的疲倦？"
        crosses:
          - "走木運：剋制重，承擔變大"
          - "走金運：清晰立界線的好時機"
          - "走火運：滋養期，自身被照亮"
        focus: |
          一個「我不收拾」的具體場景，這週執行。讓爛攤子留在原地，看世界會不會崩——通常不會。

  "庚":
    teaser:
      friend: |
        庚金日主像礦石——你直接、果斷、有開創力。問題不在你硬，是你硬到別人受傷你也沒察覺。30 歲後你會發現太直的人路會越走越窄，因為人都怕痛。
    full:
      master:
        core: |
          庚金如礦石。直接、果斷、有開創切割力。
        shadow: |
          太直傷人。把「我是為你好」當不修飾的理由。剛而不柔，會孤立。
        milestones:
          - "25-30 歲：靠直接打出一片天"
          - "30-35 歲：第一次「太硬把人推開」的後悔"
          - "40+：學會「精準」比「銳利」重要"
        inquiries:
          - "你最近一次說話傷到誰？知道嗎？"
          - "你能不能慢慢說一句話？"
          - "誰還願意聽你說真話？"
        crosses:
          - "走火運：被熔被磨，痛但成長最快"
          - "走木運：開創期，可發揮切割力"
          - "走水運：柔化過於剛硬"
        focus: |
          這週說一句重話前，先停 5 秒。換一個更柔的版本說出口，看對方反應差多少。

  "辛":
    teaser:
      friend: |
        辛金日主像珠玉——你審美敏銳、講究品質。但你會發現一件事：你太注重精緻，反而把粗糙的真實也排除了。30 歲後你會發現完美沒有發生，發生的都是不完美。
    full:
      master:
        core: |
          辛金如珠玉。審美敏銳、講究品質，氣質是天然的。
        shadow: |
          太注重精緻而排除真實。完美主義變成「我不開始」的藉口。
        milestones:
          - "20-28 歲：累積審美與品質標準"
          - "30+：發現「完美」是空集合"
          - "35+：若仍追求完美，會在生涯卡住"
        inquiries:
          - "你最近一次放棄某事是因為「不夠完美」？"
          - "你願意做出 60 分的東西嗎？"
          - "什麼是你「不完美但很重要」的事？"
        crosses:
          - "走火運：被磨被燒，成材的關鍵期"
          - "走土運：埋藏期，內化沉澱"
          - "走水運：清洗光澤，靈感豐富"
        focus: |
          一件你嫌「不夠好」沒交出來的東西，這週就交出去。讓對方看到 60 分的真實。

  "壬":
    teaser:
      friend: |
        壬水日主像大海——你流動性大、適應力強。但你會發現一件事：你想做的事太多，沒一樣做完。海是寬廣的，但海也常常什麼都沒留下。
    full:
      master:
        core: |
          壬水如大海。流動、寬廣、適應力強，視野開闊。
        shadow: |
          想太多、做太少。流動變漫無目的。經歷豐富卻無沉澱。
        milestones:
          - "20-30 歲：到處流動是健康的"
          - "30-38 歲：第一次「我必須停下來」"
          - "40+：若仍漫流，會出現深度孤獨"
        inquiries:
          - "你願意停下來做一件事多久？"
          - "你最近一次完成一件事的感覺？"
          - "什麼是你的「岸」？"
        crosses:
          - "走土運：被堵被擋，但能扎根"
          - "走木運：流動有方向，發揮最佳"
          - "走金運：源頭被生，資源豐富"
        focus: |
          一件值得停下來做 90 天的事，這週起鎖定。不要換、不要分心、不要漫流。

  "癸":
    teaser:
      friend: |
        癸水日主像雨露——你細膩、感受深、能滲透。但你會發現一件事：你太能感受別人，常常忘了感受自己。30 歲後你會發現感受深的人最需要被理解，但你最不會說。
    full:
      master:
        core: |
          癸水如雨露。細膩、感受深、能滲透細節，洞察力來自安靜。
        shadow: |
          太能感受別人而忘了自己。把「我是為你著想」當不講真話的理由。
        milestones:
          - "童年起：早慧、會讀人"
          - "25-32 歲：第一次「我太累了」"
          - "30+：學會「先感受自己」"
        inquiries:
          - "你最近一次替別人感受卻沒問自己？"
          - "你最深的感受誰知道？"
          - "你願意被照顧嗎？"
        crosses:
          - "走金運：源頭被生，敏感更精準"
          - "走土運：被堵，需要更主動表達"
          - "走木運：洩耗大，要保護自己"
        focus: |
          一個你的真實感受，這週告訴對的人。不是用問句、不是用暗示——是直接說出來。

# =====================================================================
# 12 地支文案
# ---------------------------------------------------------------------
# 地支不像天干「定性格」，地支「定處境」——它告訴你這個人在什麼位置、
# 帶著哪些藏干、會在什麼時刻顯化。所以 voice 比天干更短、更場景化。
# =====================================================================

earthly_branches:
  "子":
    nature: "水（夜半 23-1 時）—— 藏壬癸"
    teaser:
      friend: |
        子水像深夜的井——你想得深、看得遠，但常常別人看不到你想了多少。子的位置會帶你進入安靜的角落，那裡有你最真實的判斷。
    full:
      master:
        core: |
          子為極陰之水。藏深、夜行、思考為主。
        traits: |
          洞察力強、但表達慢。在群體裡往往是最後才開口、開口就準的人。直覺敏銳，尤其在夜晚。
        shadow: |
          想太多而不行動。把「我還沒想清楚」當作不開始的藉口。容易把孤獨當成獨立。
        focus: |
          這週把你深夜想清楚的事，白天說出來一件。不要等「時機」，時機是你給自己的拖延。

  "丑":
    nature: "土（深冬 1-3 時）—— 藏己癸辛"
    teaser:
      friend: |
        丑土像凍土下的礦——你扛得久、藏得深，外面看你平靜，裡面其實有金有水。你不是慢，你是還沒覺得值得用力。
    full:
      master:
        core: |
          丑為冬土。沉默、有耐力、藏才不露。
        traits: |
          耐磨、能熬、後勁強。年輕看不出鋒芒，中年後才被人發現「原來他什麼都會」。
        shadow: |
          太能忍而錯過時機。把「再等等」說了十年，醒來時別人都過去了。
        focus: |
          一件你「忍了三年以上」的事，這週做個決定——不是再忍，是動。

  "寅":
    nature: "木（早春 3-5 時）—— 藏甲丙戊"
    teaser:
      friend: |
        寅木像破曉前的衝勁——你敢開始、有方向，但常常衝得比規劃快。寅的人不是不會慢，是覺得慢就會錯過。
    full:
      master:
        core: |
          寅為陽木。開創、進取、有起手的勇氣。
        traits: |
          敢第一個動、敢冒險、有領導氣。藏火藏土代表開創之中還能落地，不只是衝。
        shadow: |
          衝太快沒回頭看隊友。把「跟不上就算了」當成果斷。容易燒過頭。
        focus: |
          這週啟動的事，停一天問身邊三個人「我是不是太快了」。聽他們講，不要反駁。

  "卯":
    nature: "木（仲春 5-7 時）—— 藏乙"
    teaser:
      friend: |
        卯木像清晨的嫩枝——你柔軟、有彈性、人緣好。但你會發現你太常順著別人轉，到最後忘了自己原本要往哪長。
    full:
      master:
        core: |
          卯為陰木。柔、彈、人緣好。
        traits: |
          會說話、會看人、能在不同群體切換身分。藝術、教育、人事相關領域有天分。
        shadow: |
          順著風轉而失去主軸。每個人問你都說「都好」，最後沒人知道你要什麼。
        focus: |
          這週對一個人說「我不要」。不解釋、不道歉。看自己會不會崩——通常不會。

  "辰":
    nature: "土（春末 7-9 時）—— 藏戊乙癸"
    teaser:
      friend: |
        辰土像春末的濕田——你包容、藏得深、有底蘊。但你常常被誤解為「沒態度」，其實你只是不急著表態。
    full:
      master:
        core: |
          辰為水庫之土。涵養、藏深、能容納多種能量。
        traits: |
          能扛複雜局面、能跟難搞的人共事、是天然的中介者。
        shadow: |
          藏太深變成沒人懂。把「都可以」說成口頭禪，連自己也找不到底線。
        focus: |
          這週對一件事亮出明確立場——支持或反對都行，就是不要「再看看」。

  "巳":
    nature: "火（初夏 9-11 時）—— 藏丙庚戊"
    teaser:
      friend: |
        巳火像盤起的蛇——你聰明、有手腕、善佈局。但你會發現太會算的人，常常被當作不能交心的人。
    full:
      master:
        core: |
          巳為陰火。智巧、有策略、會佈局。
        traits: |
          反應快、看局勢準、能在複雜環境中找縫隙生存。藏金藏土代表還能落地執行。
        shadow: |
          算得太精，別人看穿後就遠了。把「我是為大局著想」當不真誠的藉口。
        focus: |
          這週對一個重要的人，講一句「沒算過的話」。冒一次險，看會發生什麼。

  "午":
    nature: "火（正午 11-13 時）—— 藏丁己"
    teaser:
      friend: |
        午火像正午烈陽——你明朗、熱情、表現力強。但你的火太亮，常常把自己也曬乾。
    full:
      master:
        core: |
          午為陽火。烈、明、有表現力。
        traits: |
          舞台型人格、社交強、能帶動氣氛。是天生的銷售、講者、表演者。
        shadow: |
          燃燒過度耗盡自己。被掌聲綁架後，安靜下來就慌。
        focus: |
          這週有一天「不發光」——不發訊息、不貼文、不主動社交。看自己暗下來時還剩什麼。

  "未":
    nature: "土（夏末 13-15 時）—— 藏己丁乙"
    teaser:
      friend: |
        未土像夏末的田——你溫和、慢熱、有藝術氣。但你常常因為太晚啟動，把好點子留給別人去做。
    full:
      master:
        core: |
          未為燥土。溫和、慢熱、有美感。
        traits: |
          審美好、能養人、藝術或療癒類工作有天分。藏木藏火代表有創造潛力。
        shadow: |
          慢太久而錯過。把「等我準備好」說一輩子。
        focus: |
          這週把一個放了 6 個月以上的點子，做出第一版——醜也沒關係，先動。

  "申":
    nature: "金（初秋 15-17 時）—— 藏庚壬戊"
    teaser:
      friend: |
        申金像剛打出的刀——你反應快、有手段、看得透人性。但你太現實，常常少了讓人靠近的柔軟。
    full:
      master:
        core: |
          申為陽金。鋒利、現實、有手段。
        traits: |
          看局勢準、決策快、能在競爭環境中勝出。藏水代表還有滋潤、不只是硬。
        shadow: |
          太精明而冷。把「這沒效率」當作拒絕關係的理由。
        focus: |
          這週做一件「明知效率不高但對人有溫度」的事。讓刀鋒回收一次。

  "酉":
    nature: "金（仲秋 17-19 時）—— 藏辛"
    teaser:
      friend: |
        酉金像精磨的鏡——你純粹、要求高、審美敏銳。但你太挑剔，常常把「不完美的好東西」也排除了。
    full:
      master:
        core: |
          酉為陰金。純粹、銳利、講究品質。
        traits: |
          審美一流、做工精緻、追求極致。設計、品鑑、精密技藝有天分。
        shadow: |
          挑到沒人能合作。把「品味」當成排他理由。
        focus: |
          這週接受一個「不完美但真實」的合作或作品。先做了再說。

  "戌":
    nature: "土（晚秋 19-21 時）—— 藏戊辛丁"
    teaser:
      friend: |
        戌土像守夜的犬——你忠誠、有原則、講道義。但你太守，常常為了原則跟自己人翻臉。
    full:
      master:
        core: |
          戌為燥土、火庫。忠誠、有原則、是天然的守護者。
        traits: |
          有道義感、能守承諾、危機時挺身。藏火藏金代表內有熱有刃。
        shadow: |
          原則太硬而傷感情。把「我是對的」當不和解的藉口。
        focus: |
          這週為了「不是原則的事」對一個人讓一次步。看你的世界會不會塌——不會。

  "亥":
    nature: "水（初冬 21-23 時）—— 藏壬甲"
    teaser:
      friend: |
        亥水像入夜的大河——你寬廣、有想像、能流動。但你流得太遠，常常忘了自己要去哪裡。
    full:
      master:
        core: |
          亥為陽水。寬廣、有想像、能容納多元。
        traits: |
          視野大、能跨領域、有哲學氣質。藏木代表流動之中還有方向潛能。
        shadow: |
          想得太多、做得太少。把「我還在探索」說十年。
        focus: |
          這週鎖定一件 90 天能做完的事。不要換、不要分心、不要再「探索」。

# =====================================================================
# 五行平衡章節
# ---------------------------------------------------------------------
# 五行不是 5 個分類，是 5 種比例。任何一行過旺或不足都會產生對應失衡。
# 這裡寫的不是學術定義，是「老師如何對客戶說明這個失衡」的 voice。
# =====================================================================

five_elements:
  "木":
    teaser:
      friend: |
        命中木旺的人，向上的力量強，但常常往一個方向衝太久。木弱的人，知道要動卻動不起來——不是懶，是底層燃料不夠。
    full:
      master:
        excess: |
          木旺者：方向感強、敢於開創，但容易剛愎、聽不見別人。中年後若沒學會「轉彎」，會在事業中段卡住。
          建議：補金以節制、補水以滋養、補火以宣洩。生活上多接觸有原則但溫和的人。
        deficient: |
          木弱者：有想法但啟動慢、容易自我懷疑、總覺得「再準備一下」。
          建議：補水以滋養木的生機、補木以加強自身。最重要的不是補命，是這週就做一件小事——啟動本身就是補木。
        focus: |
          木的核心問題是「方向 vs 彈性」。旺者練習鬆，弱者練習動。兩種人這週都該做一件不在計畫裡的事。

  "火":
    teaser:
      friend: |
        命中火旺的人發光快、燃燒也快。火弱的人有想表達的內容，卻常常被自己的安靜淹沒——不是沒火，是沒人幫他點。
    full:
      master:
        excess: |
          火旺者：表現力強、社交快、有舞台魅力，但容易急、容易耗、容易把人燒到不敢靠近。
          建議：補水以制衡、補土以收斂、補金以塑形。生活上需要安靜獨處的時段，不然會慢性燃燒。
        deficient: |
          火弱者：有想法卻不敢表達、覺得自己「不夠亮」、社交場合容易隱身。
          建議：補木以助燃、補火以增援。最有效的不是補命，是找到一個會把你點亮的人。
        focus: |
          火的核心問題是「亮 vs 持久」。旺者練習暗，弱者練習被點燃。

  "土":
    teaser:
      friend: |
        命中土旺的人穩、扛、能成事。土弱的人總覺得自己「沒根」——不是漂，是還沒找到能落腳的場域。
    full:
      master:
        excess: |
          土旺者：穩重、可靠、能承擔，但容易僵化、固執、把「我從來都這樣」當不改變的理由。
          建議：補木以鬆動、補水以滋潤、補金以宣洩。生活上需要去見不同類型的人、做不同類型的事。
        deficient: |
          土弱者：到哪都覺得自己是過客、難以扎根、決策容易反覆。
          建議：補火以生土、補土以加強。最關鍵的不是命局，是這 90 天選一個地方、一個社群、一件事——不要換。
        focus: |
          土的核心問題是「扎根 vs 流動」。旺者練習移動，弱者練習留下。

  "金":
    teaser:
      friend: |
        命中金旺的人鋒利、果斷、有原則。金弱的人善良卻常常被欺負——不是軟，是還沒學會劃線。
    full:
      master:
        excess: |
          金旺者：判斷準、能切割複雜、能在競爭中勝出，但容易冷、容易傷人不自覺。
          建議：補火以柔化、補水以宣洩、補木以開創。生活上需要練習慢一拍說話。
        deficient: |
          金弱者：講不出「不」、難以決斷、總是替別人收拾。
          建議：補土以生金、補金以加強。最重要的不是補命，是這週對一個人說一次「不」。
        focus: |
          金的核心問題是「鋒利 vs 溫度」。旺者練習慢，弱者練習狠。

  "水":
    teaser:
      friend: |
        命中水旺的人聰明、流動、視野大。水弱的人想得到答案卻常常想不深——不是笨，是缺少能讓自己沉澱的環境。
    full:
      master:
        excess: |
          水旺者：腦袋快、看得遠、能跨領域，但容易飄、容易想太多做太少。
          建議：補土以收斂、補火以蒸發、補木以引導。生活上需要 90 天專注一件事的紀律。
        deficient: |
          水弱者：思考慢、感受淺、容易跟著場域走。
          建議：補金以生水、補水以加強。實務上是給自己每天 30 分鐘獨處——水是在安靜裡長出來的。
        focus: |
          水的核心問題是「深度 vs 行動」。旺者練習收斂，弱者練習感受。
