# =====================================================================
# Mele 命理媒介中心 — 八字解讀文案
# =====================================================================
# v1 範圍：10 天干日主 × (客戶 teaser + 老師 master full)
# 之後再補：12 地支、五行平衡、月令格局、大運流年
#
# 客戶端 (/tools/bazi) 使用 teaser.friend
# 老師後台 voice tab 切換 full.master
#
# Voice 原則：master = 溫暖長者，敢說重話、有時刻、有暗面、有立場
# =====================================================================

schema_version: 1

# 10 天干日主文案
day_masters:
  "甲":
    teaser:
      friend: |
        甲木日主就像參天大樹——你天生有方向、敢頂風長。問題不在你長得快，是你看不到別人也在長。30 歲前你會覺得世界欠你機會，30 歲後你會發現自己其實是把人擋在樹蔭下。
    full:
      master:
        core: |
          甲木如大樹。生而向上，方向感是命。
        shadow: |
          太剛直不轉彎。看不見別人的速度。把「我是為大家好」當不解釋的理由。
        milestones:
          - "28-32 歲：第一次「太剛被風吹斷」的經驗"
          - "35-40 歲：學會「轉彎不是妥協」"
          - "40+：若仍硬撐，會在事業中段卡住"
        inquiries:
          - "最近一次你堅持卻被身邊人放棄你？"
          - "你願意讓人快過你嗎？"
          - "你最近一次承認自己錯了是何時？"
        crosses:
          - "走金運：剋制過強，要小心人際"
          - "走火運：表達放大，名聲機會多但易爭"
          - "走水運：滋潤舒展期，學新東西最快"
        focus: |
          一件事「主動讓位給他人」，這週做。讓樹蔭挪一下，看誰能在那個位置長出來。

  "乙":
    teaser:
      friend: |
        乙木日主像藤花——你柔，但你也活著。問題不在你彎，是你彎太多次後忘了自己原本想長什麼方向。30 歲後你會發現所有人都用得到你，但沒人記得你也需要被支撐。
    full:
      master:
        core: |
          乙木如藤蔓。柔韌、會繞、會纏，找縫隙生長。
        shadow: |
          太會配合而失去主軸。被需要的時候很在；不被需要時就空。
        milestones:
          - "20-28 歲：到處攀附還沒選定支柱"
          - "30+：第一次認真選定「我要往哪長」"
          - "40+：若仍配合所有人，會出現存在感稀薄"
        inquiries:
          - "你最近一次主動拒絕誰？"
          - "拿掉所有要配合的對象，你想做什麼？"
          - "誰是你願意纏一輩子的支柱？"
        crosses:
          - "走木運：自身強，可獨立發展"
          - "走金運：易被人剪枝，注意人際"
          - "走土運：扎根機會，安頓資源"
        focus: |
          一件「不配合誰」的事，這週做。讓自己長一段沒有支柱的時間，看會發生什麼。

  "丙":
    teaser:
      friend: |
        丙火日主像太陽——你照亮大家，是天生發光體。但你會發現一件事：太陽要承擔讓每個人都看見的責任，沒人問過太陽今天累不累。30 歲後你會發現自己其實怕暗，因為暗下來時你就不知道自己是誰。
    full:
      master:
        core: |
          丙火如太陽。外放、照亮、帶動氣氛，存在感強。
        shadow: |
          燃燒過度耗盡自己。被掌聲綁架。怕暗下來，因為沒了光不知道自己是誰。
        milestones:
          - "20-30 歲：站在舞台中央的甜頭"
          - "30-38 歲：第一次承認「我累了」"
          - "40+：若仍只發光，會出現深度倦怠"
        inquiries:
          - "你最近一次允許自己「不發光」？"
          - "沒人看的時候，你還是你嗎？"
          - "誰在你暗下來時還願意陪你？"
        crosses:
          - "走水運：剋制大但能滋養成長"
          - "走木運：燃料充足，活躍期"
          - "走金運：照亮金屬有光但容易過熱"
        focus: |
          一天「不為別人發光」——關手機、不回訊息、不回應任何期待。看自己暗下來時是誰。

  "丁":
    teaser:
      friend: |
        丁火日主像燭火——你細膩、敏銳，能照亮細節。但你會發現一件事：你照得到別人，卻常常被自己的情緒淹沒。30 歲後你會發現你的光需要被珍惜的人陪伴，不是任何人都能在你身邊。
    full:
      master:
        core: |
          丁火如燭光。細膩、敏感、能照細節，溫度比強度重要。
        shadow: |
          容易被情緒淹沒。光小卻消耗自己快。在錯的人身邊會被吹熄。
        milestones:
          - "20-28 歲：累積敏銳但情緒起伏大"
          - "30+：學會「不是每個人都值得我為他點亮」"
          - "35+：若仍亂照亮，會慢性耗竭"
        inquiries:
          - "誰在你身邊讓你發光，誰讓你熄滅？"
          - "你最近一次替錯的人付出？"
          - "你的敏感保護了誰，又消耗了誰？"
        crosses:
          - "走木運：燃料充足，光更穩"
          - "走水運：易熄滅，要保護自己"
          - "走金運：精細表現好的時期"
        focus: |
          列出「會吹熄你的人」名單。這週減少跟其中一個人的接觸，看自己會不會比較亮。

  "戊":
    teaser:
      friend: |
        戊土日主像高山——你穩、你扛得住事情。問題不在你扛，是你扛太多。30 歲後你會發現大家都把你當依靠，但沒人問過山累不累。
    full:
      master:
        core: |
          戊土如高山。穩重、承接力強，是天然的支柱。
        shadow: |
          扛太多不說。被當成理所當然的依靠。固執而不自覺。
        milestones:
          - "25-32 歲：第一次「我也需要被照顧」"
          - "30-38 歲：發現「穩」也會變「僵」"
          - "40+：若仍硬扛，會出現腰背或消化系統訊號"
        inquiries:
          - "你最近一次承認「我撐不住了」是何時？"
          - "誰會主動扶你，不只是依靠你？"
          - "你最固執不肯改的是什麼？"
        crosses:
          - "走木運：剋制大，承受壓力多"
          - "走水運：滋潤期，資源流動"
          - "走火運：扎根穩，學習新事最佳"
        focus: |
          一件你扛了很久的事，這週主動講出「我需要幫忙」。不要等到山崩。

  "己":
    teaser:
      friend: |
        己土日主像田園——你包容、會養人。但你會發現一件事：你養了很多人事物，自己卻常被踩在腳下。30 歲後你會發現包容若沒有界線，就只是被消耗。
    full:
      master:
        core: |
          己土如田園。包容、養育、能成事，但要被珍惜。
        shadow: |
          替別人收拾過頭。包容變消耗。沒人尊重你的界線，因為你從沒劃過。
        milestones:
          - "童年起：早早成為家裡的「收拾者」"
          - "30+：第一次劃下界線的痛苦"
          - "40+：若仍包容過頭，會出現深度倦怠"
        inquiries:
          - "你最近一次替誰收拾爛攤子？"
          - "你界線在哪裡？對方知道嗎？"
          - "誰會尊重你的疲倦？"
        crosses:
          - "走木運：剋制重，承擔變大"
          - "走金運：清晰立界線的好時機"
          - "走火運：滋養期，自身被照亮"
        focus: |
          一個「我不收拾」的具體場景，這週執行。讓爛攤子留在原地，看世界會不會崩——通常不會。

  "庚":
    teaser:
      friend: |
        庚金日主像礦石——你直接、果斷、有開創力。問題不在你硬，是你硬到別人受傷你也沒察覺。30 歲後你會發現太直的人路會越走越窄，因為人都怕痛。
    full:
      master:
        core: |
          庚金如礦石。直接、果斷、有開創切割力。
        shadow: |
          太直傷人。把「我是為你好」當不修飾的理由。剛而不柔，會孤立。
        milestones:
          - "25-30 歲：靠直接打出一片天"
          - "30-35 歲：第一次「太硬把人推開」的後悔"
          - "40+：學會「精準」比「銳利」重要"
        inquiries:
          - "你最近一次說話傷到誰？知道嗎？"
          - "你能不能慢慢說一句話？"
          - "誰還願意聽你說真話？"
        crosses:
          - "走火運：被熔被磨，痛但成長最快"
          - "走木運：開創期，可發揮切割力"
          - "走水運：柔化過於剛硬"
        focus: |
          這週說一句重話前，先停 5 秒。換一個更柔的版本說出口，看對方反應差多少。

  "辛":
    teaser:
      friend: |
        辛金日主像珠玉——你審美敏銳、講究品質。但你會發現一件事：你太注重精緻，反而把粗糙的真實也排除了。30 歲後你會發現完美沒有發生，發生的都是不完美。
    full:
      master:
        core: |
          辛金如珠玉。審美敏銳、講究品質，氣質是天然的。
        shadow: |
          太注重精緻而排除真實。完美主義變成「我不開始」的藉口。
        milestones:
          - "20-28 歲：累積審美與品質標準"
          - "30+：發現「完美」是空集合"
          - "35+：若仍追求完美，會在生涯卡住"
        inquiries:
          - "你最近一次放棄某事是因為「不夠完美」？"
          - "你願意做出 60 分的東西嗎？"
          - "什麼是你「不完美但很重要」的事？"
        crosses:
          - "走火運：被磨被燒，成材的關鍵期"
          - "走土運：埋藏期，內化沉澱"
          - "走水運：清洗光澤，靈感豐富"
        focus: |
          一件你嫌「不夠好」沒交出來的東西，這週就交出去。讓對方看到 60 分的真實。

  "壬":
    teaser:
      friend: |
        壬水日主像大海——你流動性大、適應力強。但你會發現一件事：你想做的事太多，沒一樣做完。海是寬廣的，但海也常常什麼都沒留下。
    full:
      master:
        core: |
          壬水如大海。流動、寬廣、適應力強，視野開闊。
        shadow: |
          想太多、做太少。流動變漫無目的。經歷豐富卻無沉澱。
        milestones:
          - "20-30 歲：到處流動是健康的"
          - "30-38 歲：第一次「我必須停下來」"
          - "40+：若仍漫流，會出現深度孤獨"
        inquiries:
          - "你願意停下來做一件事多久？"
          - "你最近一次完成一件事的感覺？"
          - "什麼是你的「岸」？"
        crosses:
          - "走土運：被堵被擋，但能扎根"
          - "走木運：流動有方向，發揮最佳"
          - "走金運：源頭被生，資源豐富"
        focus: |
          一件值得停下來做 90 天的事，這週起鎖定。不要換、不要分心、不要漫流。

  "癸":
    teaser:
      friend: |
        癸水日主像雨露——你細膩、感受深、能滲透。但你會發現一件事：你太能感受別人，常常忘了感受自己。30 歲後你會發現感受深的人最需要被理解，但你最不會說。
    full:
      master:
        core: |
          癸水如雨露。細膩、感受深、能滲透細節，洞察力來自安靜。
        shadow: |
          太能感受別人而忘了自己。把「我是為你著想」當不講真話的理由。
        milestones:
          - "童年起：早慧、會讀人"
          - "25-32 歲：第一次「我太累了」"
          - "30+：學會「先感受自己」"
        inquiries:
          - "你最近一次替別人感受卻沒問自己？"
          - "你最深的感受誰知道？"
          - "你願意被照顧嗎？"
        crosses:
          - "走金運：源頭被生，敏感更精準"
          - "走土運：被堵，需要更主動表達"
          - "走木運：洩耗大，要保護自己"
        focus: |
          一個你的真實感受，這週告訴對的人。不是用問句、不是用暗示——是直接說出來。
