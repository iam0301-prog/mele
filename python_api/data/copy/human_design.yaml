# =====================================================================
# Mele 命理媒介中心 — 人類圖文案
# =====================================================================
# v1 範圍：
#   - types          : 5 類型（Manifestor / Generator / Manifesting Generator
#                      / Projector / Reflector）
#   - authorities    : 4 內在權威（情緒 / 薦骨 / 直覺 / 自我）
#                      （另外 3 種 — 月亮、環境、自我投射 — v2 補）
#   - centers        : 9 能量中心（頭、邏輯、喉、G、心、薦骨、脾、情緒、根）
#   - gates          : 64 閘門精簡版（核心 essence + theme）
#
# 客戶端 (/tools/human_design) 使用 teaser.friend
# 老師後台 voice tab 切換 full.master
#
# Voice 原則：master = 溫暖長者，敢說重話、有時刻、有暗面、有立場
# =====================================================================

schema_version: 1

# ---------------------------------------------------------------------
# 5 類型
# ---------------------------------------------------------------------
types:
  "Manifestor":
    name_zh: "顯示者"
    population: "約 9%"
    strategy: "告知（Inform）"
    signature: "平靜（Peace）"
    not_self: "憤怒（Anger）"
    teaser:
      friend: |
        顯示者是「啟動者」——你不需要等別人允許就能行動，這是天生的。問題不是你太衝，是你常常忘了「告知」——不是請求許可，是讓被影響的人有個準備。
    full:
      master:
        core: |
          天生有啟動新事物的能量，是宇宙的「點火器」。約 9% 的人口。
        strategy: |
          策略是「告知」——在行動之前告訴會被你影響的人。不是徵詢同意，是讓他們有準備。沒告知 = 製造憤怒。
        not_self_signature: |
          憤怒 = 你沒告知 / 沒有自由 / 被阻擋的訊號。常被誤解為「脾氣壞」，其實是能量被擋住的反應。
        shadow: |
          缺乏耐心、不告知就行動、被誤解為自我中心。
        focus: |
          這週啟動一件事前，先告訴一個會被影響的人。觀察告知後的氣氛差別。

  "Generator":
    name_zh: "生產者"
    population: "約 36%"
    strategy: "等待被回應（Respond）"
    signature: "滿足（Satisfaction）"
    not_self: "挫折（Frustration）"
    teaser:
      friend: |
        生產者是「世界的引擎」——你的薦骨像一個能量電池，但這個電池只有「被觸發」才會運轉。問題不是你能量不足，是你在做沒讓你薦骨亮起來的事。
    full:
      master:
        core: |
          有定義的薦骨，是純粹的工作生命力。約 36% 的人口（最大族群）。
        strategy: |
          策略是「等待被回應」——不主動啟動，等生活提供觸發點，用薦骨的 ah-huh / un-uh 反應決定。
        not_self_signature: |
          挫折 = 你在做沒讓薦骨點頭的事。長期挫折 → 倦怠。滿足感是健康指標。
        shadow: |
          硬撐做不喜歡的事、把「應該」當成必須、忽略身體訊號。
        focus: |
          這週注意身體對每個邀請 / 機會的反應。不要用頭腦壓過身體說的話。

  "Manifesting Generator":
    name_zh: "顯示生產者"
    population: "約 33%"
    strategy: "回應 + 告知（Respond, then Inform）"
    signature: "滿足與平靜（Satisfaction & Peace）"
    not_self: "挫折與憤怒（Frustration & Anger）"
    teaser:
      friend: |
        顯示生產者是「快速多軌道」——你能同時做好幾件事，過程也跳來跳去。問題不是你不專注，是你被要求「像生產者一樣線性」反而會崩潰。
    full:
      master:
        core: |
          結合顯示者與生產者特質，多面向、跳躍式推進。約 33% 的人口。
        strategy: |
          先回應（用薦骨判斷）—— 確認 ah-huh —— 然後告知會被影響的人。雙策略。
        not_self_signature: |
          挫折 + 憤怒。常被批評「三分鐘熱度」，其實是天生跳躍式學習。
        shadow: |
          被「要專注一件事」綁住、跳得太快漏掉細節、不告知造成衝突。
        focus: |
          這週允許自己同時做 3 件事，但每件啟動時都告知關鍵人物。

  "Projector":
    name_zh: "投射者"
    population: "約 21%"
    strategy: "等待邀請（Wait for the Invitation）"
    signature: "成功（Success）"
    not_self: "苦澀（Bitterness）"
    teaser:
      friend: |
        投射者是「引導者」——你能看見別人看不見的事，但你需要「被邀請」才能發揮影響力。問題不是你沒能力，是你常常硬擠進去，最後被當成「越權」。
    full:
      master:
        core: |
          沒有定義的薦骨，是天生的引導者與看見者。約 21% 的人口。
        strategy: |
          策略是「等待邀請」——大方向的事（職涯、關係、住所）需要被正式邀請才會順利。日常小事不需要等。
        not_self_signature: |
          苦澀 = 你的能力沒被看見 / 沒被邀請就闖進去。長期苦澀 = 系統警訊。
        shadow: |
          未被邀請時硬上、被忽視時自我貶低、靠工作量證明自己。
        focus: |
          這週對一件你想做但沒被邀請的事「不主動推」。看誰會自己來邀。

  "Reflector":
    name_zh: "反映者"
    population: "約 1%"
    strategy: "等待月亮週期（Wait a Lunar Cycle）"
    signature: "驚喜（Surprise）"
    not_self: "失望（Disappointment）"
    teaser:
      friend: |
        反映者是「社區的鏡子」——你會反映身邊環境的健康狀態。問題不是你太敏感，是你常被當成「沒主見」。其實你的主見要花一個月才會浮現。
    full:
      master:
        core: |
          九個能量中心全部沒定義，是宇宙的稀有族群（約 1%）。完全受月亮週期影響。
        strategy: |
          大決定需等一個完整月亮週期（約 28 天）。不要急著決定。
        not_self_signature: |
          失望 = 在錯的環境太久 / 太快做決定。驚喜 = 你在對的場域。
        shadow: |
          被環境吞噬而失去自我、急著定義自己、選錯朋友圈而長期消耗。
        focus: |
          盤點你身邊 5 個最常接觸的人——他們是讓你發光還是讓你失色？

# ---------------------------------------------------------------------
# 4 內在權威（v1 範圍；月亮 / 環境 / 自我投射權威 v2 再補）
# ---------------------------------------------------------------------
authorities:
  "Emotional":
    name_zh: "情緒權威"
    population: "約 50%"
    teaser:
      friend: |
        情緒權威的人，沒有「當下的真實」——你的真實要走過情緒波，從高到低、從低到高，全部走完才會浮現。30 歲後你會學會：當天的回答都不是答案。
    full:
      master:
        core: |
          情緒中心有定義，決策需要等情緒波走完。不能用當下感覺決定大事。
        practice: |
          重大決定至少睡一晚——理想是 24-72 小時，最好走完一次情緒週期高低。
        shadow: |
          急著回答而後悔、被情緒高峰逼著承諾、低谷時做出絕對結論。
        focus: |
          這週對任何重要邀請答「我明天回你」。即使心裡已有答案，也不要當下說。

  "Sacral":
    name_zh: "薦骨權威"
    population: "約 35%"
    teaser:
      friend: |
        薦骨權威的人，答案在身體裡——不在腦袋。你的 ah-huh / un-uh 是宇宙幫你裝的內建羅盤，但你一直被教「用邏輯」，所以失準。
    full:
      master:
        core: |
          薦骨中心有定義（生產者 / 顯生），靠當下身體反應決定。
        practice: |
          請信任的人問你 yes/no 問題，注意身體第一秒的反應——不是頭腦的分析。
        shadow: |
          忽略身體訊號、用「應該」壓過 un-uh、長期硬撐導致薦骨疲憊。
        focus: |
          這週每天問自己 3 個 yes/no 問題，記錄第一秒身體反應。

  "Splenic":
    name_zh: "直覺權威"
    population: "約 10%"
    teaser:
      friend: |
        直覺權威的人，答案只在「當下那一瞬」——脾中心給你一個閃念，過了就沒了。問題不是你直覺不準，是你太常用腦袋覆蓋。
    full:
      master:
        core: |
          脾中心有定義（投射者中常見）。直覺只說一次，不重複。
        practice: |
          相信第一個閃過的念頭。脾不會給你「兩次機會」——錯過就要等下次。
        shadow: |
          用邏輯否決直覺、後悔當初沒聽、忽視身體的健康警訊。
        focus: |
          這週對 3 個「第一直覺」說好——即使腦袋反對。記錄結果。

  "Self-Projected":
    name_zh: "自我投射權威"
    population: "約 5%"
    teaser:
      friend: |
        自我投射權威的人，答案在「你說話的過程」——你不知道你想什麼，直到你聽見自己說。所以你需要的不是分析，是值得信任的聆聽者。
    full:
      master:
        core: |
          G 中心有定義且情緒、脾、薦骨皆未定義。透過聲音找到方向。
        practice: |
          找一個能聽你「自言自語」的朋友。對著他/她說 5-10 分鐘，注意你說出什麼。
        shadow: |
          困在頭腦裡找答案、缺乏聆聽者、把獨自分析當不必說出口的擋箭牌。
        focus: |
          這週對一個信任的人「自言自語」一次重大決定。聽自己說了什麼。

# ---------------------------------------------------------------------
# 9 能量中心
# ---------------------------------------------------------------------
centers:
  "Head":
    name_zh: "頭頂中心"
    function: "靈感 / 提問 / 思考的壓力"
    teaser:
      friend: |
        頭頂中心是「壓力之一」——它推你想答案、問問題。有定義的人不會被外界的問題綁架；沒定義的人容易被別人的問題吞噬，誤以為都是自己該想的。
    full:
      master:
        defined: |
          有定義（約 30%）：穩定的靈感來源、有自己的提問體系、不被他人的疑問動搖。
        undefined: |
          沒定義（約 70%）：放大他人的問題、容易陷入「我必須想清楚」的焦慮迴圈。
        not_self: |
          沒定義者：執著於回答不是自己的問題、為他人焦慮、用「我還沒想清楚」拖延。
        focus: |
          沒定義者：練習問「這個問題真的是我的嗎？」三次再決定要不要花時間想。

  "Ajna":
    name_zh: "邏輯中心"
    function: "概念化 / 確定性 / 心智模式"
    teaser:
      friend: |
        邏輯中心負責「想出確定性」。有定義的人有自己一套穩定的思考框架；沒定義的人容易借用別人的思考方式，誤以為是自己的。
    full:
      master:
        defined: |
          有定義（約 47%）：固定的思考方式、能保持心智一致性、不易被論辯動搖。
        undefined: |
          沒定義（約 53%）：能吸收多元觀點、思考靈活、但易陷入「我必須確定」的假裝。
        not_self: |
          沒定義者：假裝確定、堅持立場以掩飾不確定、被他人的觀點吞噬而忘了自己怎麼想。
        focus: |
          沒定義者：練習說「我不確定」「我還在思考」。不確定是禮物，不是缺陷。

  "Throat":
    name_zh: "喉嚨中心"
    function: "表達 / 顯化 / 行動"
    teaser:
      friend: |
        喉嚨是「顯化中心」——所有想法要透過這裡變成行動或語言。有定義的人能持續表達；沒定義的人容易在不對的時機被推著說話。
    full:
      master:
        defined: |
          有定義（約 71%）：能穩定表達、適合公開發言、有自己的聲音風格。
        undefined: |
          沒定義（約 29%）：說話需等對的時機（被邀請、被認可、有對象）。
        not_self: |
          沒定義者：強行說話以爭取注意、講太多無關內容、被忽視時感到痛苦。
        focus: |
          沒定義者：練習「沒被問就不主動講」。當被邀請說話時你會驚訝自己有多有力。

  "G":
    name_zh: "G 中心 / 自我中心"
    function: "身份認同 / 方向 / 愛"
    teaser:
      friend: |
        G 中心是你的「指南針」——告訴你你是誰、要去哪裡。有定義的人有穩定的自我感；沒定義的人需要「對的環境」才能感受自己。
    full:
      master:
        defined: |
          有定義（約 57%）：穩定的身份感、知道自己是誰與要去哪。
        undefined: |
          沒定義（約 43%）：身份隨環境流動、需要對的場域找到自己。
        not_self: |
          沒定義者：強行定義自己、選擇錯的住所 / 工作 / 伴侶、迷失方向感。
        focus: |
          沒定義者：「住對地方」是關鍵。一個正確的物理位置就能換命運。

  "Heart":
    name_zh: "意志中心 / 心中心"
    function: "意志力 / 物質意願 / 自我價值"
    teaser:
      friend: |
        意志中心是「物質的引擎」——它驅動你想證明、想擁有、想成就。有定義的人能穩定承諾；沒定義的人容易做出超出自己負荷的承諾。
    full:
      master:
        defined: |
          有定義（約 37%）：意志力可預期、能堅持承諾、適合銷售 / 業務。
        undefined: |
          沒定義（約 63%）：意志力不穩、不應做「需證明自己」的承諾。
        not_self: |
          沒定義者：硬要證明自己、過度承諾、誤把疲倦當不夠努力。
        focus: |
          沒定義者：每次想「我必須證明」時停一下，問「我在跟誰證明？」

  "Sacral":
    name_zh: "薦骨中心"
    function: "生命力 / 工作能量 / 性能量"
    teaser:
      friend: |
        薦骨是「身體的能量電池」——有定義的人是天生的工作者；沒定義的人不該「持續工作」，會耗竭。
    full:
      master:
        defined: |
          有定義（約 70%）：純粹的工作能量、需透過勞動釋放、靠 yes/no 反應決策。
        undefined: |
          沒定義（約 30%）：放大他人的薦骨能量、誤以為自己也是工作機器。
        not_self: |
          沒定義者：硬撐工作、無法停止、長期耗竭、把「我不夠勤勞」當自我懲罰。
        focus: |
          沒定義者：必須學會「停下來」。一週至少 2 天完全離開工作場域。

  "Splenic":
    name_zh: "脾中心"
    function: "直覺 / 健康 / 恐懼 / 當下"
    teaser:
      friend: |
        脾是「當下生存」的中心——直覺、免疫、健康警訊都在這。有定義的人有可靠的直覺；沒定義的人容易抓著不健康的關係或習慣不放。
    full:
      master:
        defined: |
          有定義（約 55%）：當下直覺準、身體警訊敏感、健康自癒力強。
        undefined: |
          沒定義（約 45%）：放大他人健康狀態、容易抓著不對的人事物。
        not_self: |
          沒定義者：抓著不健康的關係、害怕放手、把熟悉當安全。
        focus: |
          沒定義者：練習「該放就放」。離開讓你不舒服的人事物，不要找理由留下。

  "Solar Plexus":
    name_zh: "情緒中心"
    function: "情緒波 / 感受深度 / 創造力"
    teaser:
      friend: |
        情緒中心是「波浪型」——情緒會自然地高低起伏。有定義的人帶著波生活；沒定義的人容易吸收別人的情緒當自己的。
    full:
      master:
        defined: |
          有定義（約 50%）：天生有情緒波、需走完波再決策、創造力源於情緒深度。
        undefined: |
          沒定義（約 50%）：高度敏感、避免衝突、放大他人情緒。
        not_self: |
          沒定義者：扮演和事佬、害怕衝突、用迎合避免高溫情緒、長期內傷。
        focus: |
          沒定義者：學會面對衝突。離開情緒過熱的場域不是逃避，是健康。

  "Root":
    name_zh: "根中心"
    function: "腎上腺壓力 / 動力 / 節奏"
    teaser:
      friend: |
        根中心是「壓力之二」——腎上腺給你的動力。有定義的人有穩定的節奏；沒定義的人容易把外界的壓力當成自己的，急著做完所有事。
    full:
      master:
        defined: |
          有定義（約 39%）：穩定的壓力節奏、能持續、不易被趕。
        undefined: |
          沒定義（約 61%）：放大壓力、容易被「快點做完」吞噬。
        not_self: |
          沒定義者：把「快點做完才能放鬆」當錯覺、其實做完還有下一件。
        focus: |
          沒定義者：練習「不急著清空待辦清單」。永遠不會清空，享受過程才對。

# ---------------------------------------------------------------------
# 64 閘門（精簡版：essence / shadow / gift / master_note）
# ---------------------------------------------------------------------
# v1 採精簡格式，方便 engine 快速 lookup。
# 完整 6 爻細節、星體影響、和諧通道 v2 補。
#
# 每個 gate 提供：
#   essence       — 一句話本質
#   shadow        — 失衡 / 低頻表現
#   gift          — 平衡 / 高頻表現
#   master_note   — 老師對客戶可以說的一句重點
# ---------------------------------------------------------------------
gates:
  1:
    name_zh: "自我表達"
    essence: |
      原創的自我表現、藝術家的閘門。
    shadow: |
      憂鬱、覺得自己無人能懂、藝術才華被卡住。
    gift: |
      把孤獨轉化為原創性的表達。
    master_note: |
      你的孤獨不是病，是原料。把它做成東西。
  2:
    name_zh: "接受"
    essence: |
      高層次自我的方向、接收方向感。
    shadow: |
      迷失方向、不知道自己要什麼。
    gift: |
      信任高層次自我的指引、不必強求方向。
    master_note: |
      方向會自己浮現，但前提是你停下強求的力氣。
  3:
    name_zh: "秩序"
    essence: |
      新事物起步的混亂期、創新的困難。
    shadow: |
