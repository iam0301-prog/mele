      被細節淹沒、看不見大局。
    gift: |
      用精準的細節傳遞訊息。
    master_note: |
      你的細節是力量，但要服務於整體。
  63:
    name_zh: "懷疑"
    essence: |
      邏輯的懷疑、質疑的能量。
    shadow: |
      過度懷疑、被疑問淹沒。
    gift: |
      用懷疑推動更好的答案。
    master_note: |
      懷疑是工具，不是生活方式。
  64:
    name_zh: "混亂"
    essence: |
      心智的混亂期、新理解的孕育。
    shadow: |
      被混亂卡住、急著找答案。
    gift: |
      允許混亂、等待新理解浮現。
    master_note: |
      你的混亂是大腦正在重組。給它時間。
