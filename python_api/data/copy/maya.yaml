# =====================================================================
# Mele 命理媒介中心 — 馬雅曆解讀文案
# =====================================================================
# v1 範圍：20 個太陽圖騰 × (客戶 teaser + 老師 master full)
# 之後再補：scholar / friend full voices、13 銀河調性深解、260 Kin 全集
#
# 客戶端 (/tools/maya) 使用 teaser.friend
# 老師後台 voice tab 切換 full.master
#
# Voice 原則：master = 溫暖長者，敢說重話、有時刻、有暗面、有立場
# =====================================================================

schema_version: 1

# 太陽圖騰文案（20 個）— key 用中文圖騰名
seals:
  "龍":
    teaser:
      friend: |
        紅龍的人是「滋養者」——你常常先照顧別人才照顧自己。問題不在你會付出，是你會把「被需要」誤認為「被愛」。30 歲前你會以為犧牲就是責任，30 歲後你會發現沒有自己的人，也照顧不了誰。
    full:
      master:
        core: |
          滋養者。把空白變成生命，把陌生變成家。
        shadow: |
          先照顧別人才覺得自己有用。母性過載——把不該背的也背起來。「被需要」誤認為「被愛」。
        milestones:
          - "童年起：早早承擔家庭情緒"
          - "30 前後：第一次「我可以不犧牲」的覺醒"
          - "40+：若仍過度給予，會出現照顧者倦怠"
        inquiries:
          - "最近一次為了照顧誰而省略自己？"
          - "如果沒有人需要你，你會做什麼？"
          - "誰會主動問你今天好不好？"
        crosses:
          - "配藍夜：照顧他人之餘還在腦中反芻"
          - "配黃太陽：照亮別人卻不允許自己陰天"
          - "對沖白世界橋：學會放手是這輩子的功課"
        focus: |
          找一件「不照顧誰」的事，這週實際做。讓自己感受「我什麼都沒給也是有價值的」。

  "風":
    teaser:
      friend: |
        白風的人是「傳遞者」——你天生會把感受變成可以說的話。但你會發現一件事：你越會講，越不太行動。話講完了，事情常常還停在原地。
    full:
      master:
        core: |
          傳遞者。讓訊息流動，把心裡的東西吹到外面。
        shadow: |
          講太多卻不行動。用「溝通」代替「決定」。重要的人面前反而失語。
        milestones:
          - "20-25 歲：找到自己的表達媒介"
          - "30+：發現「講完不等於做完」"
          - "35+：若仍只講不做，會出現深度失語"
        inquiries:
          - "最近想說但沒說的是什麼？"
          - "你的話有多少變成了行動？"
          - "對最重要的人，你說過最真的一句是什麼？"
        crosses:
          - "配紅蛇：直覺強但容易躁，講太快"
          - "配黃戰士：真相說太直，傷自己也傷人"
          - "對沖黃星星：表達被「好看」綁架"
        focus: |
          找一句話，今天就說。不修飾、不打草稿，講給該聽的人。

  "夜":
    teaser:
      friend: |
        藍夜的人是「夢想家」——你的內在世界比外面大得多。但你會發現一件事：你想了很多，做的卻少。夢想很豐盛，銀行帳戶很瘦。
    full:
      master:
        core: |
          夢想家。把意念變寶藏，內在比外面更豐盛。
        shadow: |
          沉溺在夢裡不落地。用「我還在想」當不行動的藉口。豐盛信念過度卻仍貧瘠。
        milestones:
          - "童年-青春期：內在世界比同儕豐富"
          - "30+：從幻想轉成具體實作的關卡"
          - "35+：若仍只夢不做，內外落差會壓垮人"
        inquiries:
          - "你的夢中藏了什麼還沒落地的事？"
          - "如果今天就動，你會先做什麼？"
          - "你最常用什麼句子推遲行動？"
        crosses:
          - "配紅龍：想得太多卻不照顧自己"
          - "配藍手：夢與行動的拉扯"
          - "對沖紅蛇：身體訊號被頭腦蓋住"
        focus: |
          找一個 30 分鐘內可以做的「夢想小步驟」，今天就做。不要完美，要動。

  "種子":
    teaser:
      friend: |
        黃種子的人是「播種者」——你看得到別人身上的潛能。但你會發現一件事：你看別人的種子很清楚，自己的卻一直沒種下去。
    full:
      master:
        core: |
          播種者。看見潛能，相信時間會長出東西。
        shadow: |
          永遠在「準備」階段。種子放著不下土。看別人的潛力很準，看自己的卻盲。
        milestones:
          - "20-28 歲：累積能力但還沒選方向"
          - "28-35 歲：第一次認真選定一顆種子"
          - "40+：若仍沒選定，會出現「我什麼都會但都沒成」的空虛"
        inquiries:
          - "你心裡哪顆種子已經想了 3 年以上？"
          - "什麼時候你會說「我準備好了」？"
          - "如果只能選一顆種，你選哪一顆？"
        crosses:
          - "配白風：太多想法分散"
          - "配藍鷹：想得很大卻不收"
          - "對沖白巫師：等時機等到時機過了"
        focus: |
          選一顆種子，下週實際種下去。哪怕只是註冊一個課程、寫一封信、買一個工具。

  "蛇":
    teaser:
      friend: |
        紅蛇的人是「身體智者」——你的直覺領跑頭腦。但你會發現一件事：你常常被身體拉著走，事後才後悔沒先想清楚。
    full:
      master:
        core: |
          身體智者。直覺領跑，本能比邏輯快。
        shadow: |
          衝動行事，事後才理性。用「我感覺」當不檢驗的藉口。把生命力誤用在小事上。
        milestones:
          - "20-25 歲：靠直覺活得很爽"
          - "25-32 歲：第一次因衝動付出代價"
          - "30+：學會「先停 24h 再決定」"
        inquiries:
          - "上一次你被身體拉著走卻後悔？"
          - "你的直覺對的時候多還是錯的時候多？"
          - "什麼事你需要先停下來再決定？"
        crosses:
          - "配白風：講太快，話跟著直覺出口"
          - "配藍手：用身體勞動避開思考"
          - "對沖白巫師：等不下去，反而錯過時機"
        focus: |
          這週遇到一個「想立刻行動」的衝動時，先記下來，24h 後再決定。

  "世界橋":
    teaser:
      friend: |
        白世界橋的人是「結束者」——你比別人更會幫舊的東西優雅退場。但你會發現一件事：你會抓著結束的儀式不放，反而拖住了新的開始。
    full:
      master:
        core: |
          結束者。幫舊事優雅退場，讓新事有位子。
        shadow: |
          過度抓著結束的儀式。用「我還沒處理好」推遲新開始。喜歡「結束」反而怕「重新開始」。
        milestones:
          - "30-38 歲：處理上一段大關係或工作的尾聲"
          - "40+：若未完整結束，會出現生命停滯感"
          - "持續：每 7-10 年一個大的「斷層」"
        inquiries:
          - "你最近結束了什麼？怎麼結束的？"
          - "現在還拖著沒結束的是什麼？"
          - "如果結束了，你怕變成誰？"
        crosses:
          - "配藍夜：抓著回憶不放"
          - "配黃太陽：結束才能重生"
          - "對沖紅龍：學會放手"
        focus: |
          一件該結束卻拖著的事，今天定個結束日。寫在月曆上，到了就執行。

  "手":
    teaser:
      friend: |
        藍手的人是「動手者」——你做出來才相信。但你會發現一件事：你用「忙」逃避情緒。做完一件馬上找下一件，從不讓自己閒。
    full:
      master:
        core: |
          動手者。做出來才相信，技藝是他的語言。
        shadow: |
          用忙碌逃避情緒。做完一件馬上找下一件。閒下來就焦慮。
        milestones:
          - "20-30 歲：累積技藝、做出作品"
          - "30-38 歲：學會「不做也是一種完成」"
          - "40+：身體會強迫你慢下來"
        inquiries:
          - "你有多久沒讓手閒下來？"
          - "你最近一次什麼都不做，是什麼時候？"
          - "你怕閒下來會發現什麼？"
        crosses:
          - "配紅蛇：用體力撐住情緒"
          - "配黃星星：太注重完成的形式"
          - "對沖白風：少了表達就只是動作"
        focus: |
          這週給自己 1 天「不動手」——不工作、不家務、不滑手機。看會發生什麼。

  "星星":
    teaser:
      friend: |
        黃星星的人是「美感者」——你會把世界調成和諧。但你會發現一件事：你為了好看，常常犧牲真實。表面光鮮，內裡卻在累積疲勞。
    full:
      master:
        core: |
          美感者。把混亂調成和諧，質感是他的本能。
        shadow: |
          為了好看犧牲真實。內外落差大——表面風光，內裡疲憊。完美主義成了精緻的監獄。
        milestones:
          - "20-25 歲：開始建立個人美學"
          - "25-32 歲：發現「完美形象」累垮自己"
          - "35+：若仍追求外在和諧，會出現深度自我懷疑"
        inquiries:
          - "你最近一次刻意不修圖、不修飾自己？"
          - "什麼是你「不漂亮但很重要」的事？"
          - "別人看到的你跟真實的你差距多大？"
        crosses:
          - "配白風：表達中追求美卻無料"
          - "配藍鷹：美感變僵硬完美主義"
          - "對沖白鏡：照見真相時最痛"
        focus: |
          允許一件事「就是不漂亮」——傳一張不修圖的照片、寫一段不通順的話、出一次不化妝的門。

  "月":
    teaser:
      friend: |
        紅月的人是「流動者」——你的情緒像水。但你會發現一件事：你被自己情緒淹沒太多次，久了用「我很敏感」當不負責任的藉口。
    full:
      master:
        core: |
          流動者。情緒像水，淨化是他的天賦。
        shadow: |
          被自己情緒淹沒。用「敏感」當不負責任的藉口。讓別人替他的情緒負責。
        milestones:
          - "20-25 歲：情緒強度大但還不會處理"
          - "30+：學會把情緒放在身體外觀察"
          - "35+：若沒學會，會出現慢性身心症狀"
        inquiries:
          - "你最近一次承認自己「過度反應」？"
          - "你會把情緒怪罪在誰身上？"
          - "你的情緒從何時開始固定模式？"
        crosses:
          - "配藍夜：情緒+夢境淹自己"
          - "配黃戰士：用情緒攻擊"
          - "對沖藍風暴：情緒爆炸式釋放"
        focus: |
          這週遇到強烈情緒時，先寫下「這是我的情緒，不是事實」。練習一次「不替別人感受負責」。

  "狗":
    teaser:
      friend: |
        白狗的人是「忠誠者」——愛是你的命。但你會發現一件事：你對不對的人也太忠誠了。過度討好換取的愛，最後都會還回來。
    full:
      master:
        core: |
          忠誠者。愛是命，心是他的羅盤。
        shadow: |
          對不對的人忠誠。過度討好換愛。「我可以等」是他的長期咒語。
        milestones:
          - "童年起：學會用討好換安全感"
          - "30-35 歲：認清誰值得自己這麼忠"
          - "40+：若仍守錯人，會出現深度幻滅"
        inquiries:
          - "你最近一次替誰守一個不該守的承諾？"
          - "誰會在你生日打給你？"
          - "你願意為自己忠誠多少？"
        crosses:
          - "配紅龍：過度母性照顧"
          - "配白世界橋：該斷沒斷"
          - "對沖黃星星：忠誠變成自我消磨"
        focus: |
          找一個「不再忠誠」的具體決定——退一個 line 群、不回那通電話、結束一段給太多的關係。

  "猴":
    teaser:
      friend: |
        藍猴的人是「玩心者」——你把困局變遊戲。但你會發現一件事：你用玩笑蓋住難過，久了真話被自己當成笑話。
    full:
      master:
        core: |
          玩心者。把困局變遊戲，幽默是他的盾。
        shadow: |
          用玩笑逃避真話。不被認真對待後反而傷。真話被自己當成笑話。
        milestones:
          - "童年-青春期：用玩心存活"
          - "25-32 歲：開始發現「沒人認真聽我」"
          - "30+：學會在玩笑後說真話"
        inquiries:
          - "你最近一次用幽默蓋住難過？"
          - "誰能聽懂你笑容下的話？"
          - "你最後一次認真說真話，是對誰？"
        crosses:
          - "配紅蛇：過動，玩心+身體都停不下"
          - "配黃人：玩心+理性的拉扯"
          - "對沖白鏡：玩笑遇上真相時最尷尬"
        focus: |
          這週講一個玩笑後，加一句「其實...」——讓對方聽到玩笑底下的話。

  "人":
    teaser:
      friend: |
        黃人的人是「選擇者」——自由意志是你的命。但你會發現一件事：你過度分析每個選擇，最後用「我還沒決定」拖延人生。
    full:
      master:
        core: |
          選擇者。自由意志是命，每一個決定都認真。
        shadow: |
          過度分析。用「我還沒選」拖延。怕選錯，所以從不選。
        milestones:
          - "25-30 歲：第一個重大人生選擇"
          - "30-35 歲：學會「選錯也算選」"
          - "40+：若仍逃避選擇，會出現「人生被決定」的無力感"
        inquiries:
          - "你拖最久的選擇是什麼？"
          - "如果這週必須選一個，你選哪個？"
          - "你怕選錯什麼？"
        crosses:
          - "配藍鷹：想太遠不選"
          - "配白風：用講代替選"
          - "對沖白巫師：等時機等到時機過了"
        focus: |
          找一個拖了 6 個月以上的選擇，這週決定。寫下決定日期，到日子就執行。

  "天行者":
    teaser:
      friend: |
        紅天行者的人是「探索者」——你需要邊界外的世界。但你會發現一件事：你永遠覺得「這裡不夠」，於是換工作、換城市、換感情——但每次到新的地方，又開始覺得不夠。
    full:
      master:
        core: |
          探索者。需要邊界外的世界，移動是他的氧氣。
        shadow: |
          永遠覺得這裡不夠。逃避深耕。用「環境不對」當不留下的藉口。
        milestones:
          - "20-28 歲：流浪期是健康的"
          - "28-35 歲：第一次「留下來」的挑戰"
          - "35+：若仍流浪，會發現自己什麼都淺嘗"
        inquiries:
          - "上一次你想搬走 / 換工作 / 換感情是什麼時候？"
          - "什麼會讓你願意「留下來」？"
          - "你怕停下來會發現什麼？"
        crosses:
          - "配藍夜：流浪+夢想雙重逃避"
          - "配黃種子：邊探索邊選定的拉扯"
          - "對沖白世界橋：學會真正結束才能真正開始"
        focus: |
          一件值得停下來的事，這週起停 3 個月不換。看看不動的時候會發生什麼。

  "巫師":
    teaser:
      friend: |
        白巫師的人是「接收者」——臨在是你的天賦。但你會發現一件事：你太會等候，等到「時機」永遠不來。臨在不等於不動。
    full:
      master:
        core: |
          接收者。臨在而非控制，與時機同步是他的禮物。
        shadow: |
          等到不動。用「時機未到」逃避行動。把被動誤認為禪意。
        milestones:
          - "20-25 歲：靈性敏感度開啟"
          - "30+：認清「臨在 ≠ 不動」"
          - "35+：若仍等候，會出現深度無力感"
        inquiries:
          - "你最近一次「等時機」等多久了？"
          - "什麼會讓你願意先動？"
          - "你怕「自己決定」會發生什麼？"
        crosses:
          - "配藍夜：都是接收沒輸出"
          - "配黃人：過度旁觀"
          - "對沖紅蛇：頭腦壓住身體訊號"
        focus: |
          一件「先動再看」的事，今天就做。把「等時機」改成「製造時機」。

  "鷹":
    teaser:
      friend: |
        藍鷹的人是「高視者」——你看大局。但你會發現一件事：你看太遠，常常忽略眼前；俯視別人，卻沒下來幫忙。
    full:
      master:
        core: |
          高視者。看大局，看見別人看不到的格局。
        shadow: |
          看太遠忽略眼前。俯視別人卻不下來幫忙。願景多但落地少。
        milestones:
          - "25-32 歲：累積宏觀視野"
          - "35+：學會把高視轉成行動藍圖"
          - "40+：若仍只看不做，會出現「我看到了又怎樣」的虛無"
        inquiries:
          - "你看到的大畫面有多少真的落地了？"
          - "你最近一次下來幫人，是什麼時候？"
          - "什麼讓你願意專注在小細節？"
        crosses:
          - "配黃種子：看大卻種小，拉扯大"
          - "配白風：表達層次差距大"
          - "對沖紅地球：看天卻不接地"
        focus: |
          一個願景，拆成下個月可驗證的一步。不要一年計畫——要這週可以做的事。

  "戰士":
    teaser:
      friend: |
        黃戰士的人是「提問者」——你誠實追問。但你會發現一件事：你用提問當攻擊，問完不接受答案——只是想證明自己是對的。
    full:
      master:
        core: |
          提問者。誠實追問，敢問別人不敢問的。
        shadow: |
          用提問當攻擊。不接受答案。「為什麼」變成審判而非好奇。
        milestones:
          - "20-30 歲：建立提問的力量"
          - "30+：學會「答案是 No 也算答案」"
          - "35+：若仍只問不接受，會孤立自己"
        inquiries:
          - "你最近一個拒絕接受答案的問題？"
          - "你提問是想知道，還是想證明？"
          - "什麼答案你最怕聽到？"
        crosses:
          - "配藍鷹：質問大局卻不行動"
          - "配紅月：用情緒包裝提問"
          - "對沖白鏡：提問遇上真相時最痛"
        focus: |
          接受一個你不喜歡的答案，這週。不爭、不問、不證明——就接受。

  "地球":
    teaser:
      friend: |
        紅地球的人是「導航者」——你聽環境的訊號。但你會發現一件事：你過度依賴「徵兆」，把它當命令，不下決定就等宇宙告訴你。
    full:
      master:
        core: |
          導航者。聽環境訊號，與大地節奏共振。
        shadow: |
          過度依賴徵兆。不下決定等宇宙告知。把巧合當必然。
        milestones:
          - "25-30 歲：開始注意到 synchronicity"
          - "35+：學會「徵兆是提醒不是命令」"
          - "40+：若仍只看徵兆，會錯過主動機會"
        inquiries:
          - "你最近一次「等徵兆」等了多久？"
          - "什麼讓你願意先決定再看？"
          - "你怕主動選擇會錯過什麼？"
        crosses:
          - "配白巫師：過度被動"
          - "配藍夜：用直覺逃避理性"
          - "對沖藍鷹：看地卻不看天"
        focus: |
          一個決定，不等徵兆，這週決定。決定後再看世界給你什麼回應。

  "鏡":
    teaser:
      friend: |
        白鏡的人是「真相者」——你照見本質。但你會發現一件事：你用真相傷人，也無法接受自己的真相。真相若沒有溫柔，就只是刀。
    full:
      master:
        core: |
          真相者。照見本質，看穿假象是他的本能。
        shadow: |
          用真相傷人。無法接受自己的真相。把銳利當誠實。
        milestones:
          - "20-30 歲：建立看透事情的能力"
          - "30+：學會「溫柔地說真話」"
          - "35+：若仍銳利，會逐漸沒人敢靠近"
        inquiries:
          - "你最近一句該說但沒說的真話？"
          - "你最怕聽見關於自己的什麼真相？"
          - "你說真話時是想幫人，還是想贏？"
        crosses:
          - "配黃戰士：真相+追問太銳利"
          - "配白世界橋：用真相結束關係"
          - "對沖黃星星：照見美感的假"
        focus: |
          一句真話，溫柔地說出來。不為了贏、不為了刺，只為了讓對方真的聽見。

  "風暴":
    teaser:
      friend: |
        藍風暴的人是「變革者」——你催化重啟。但你會發現一件事：你製造完混亂後常常不收尾，留下一堆爛攤子給別人。
    full:
      master:
        core: |
          變革者。催化重啟，把停滯炸開的人。
        shadow: |
          製造混亂後不收尾。用爆衝代替慢工。「砍掉重練」是他的逃避。
        milestones:
          - "25-32 歲：第一次主動爆破自己的人生"
          - "30+：經歷「主動結束」的代價"
          - "35+：學會「不重啟、好好收尾」也是力量"
        inquiries:
          - "你最近一次「炸掉重來」是什麼？"
          - "你會不會其實怕慢慢來？"
          - "什麼是你沒收尾的舊事？"
        crosses:
          - "配白世界橋：雙重結束的暴力感"
          - "配紅蛇：衝動引爆"
          - "對沖黃星星：破壞和諧的衝動"
        focus: |
          一件你想砍掉重來的事，這週**不重啟**——而是好好收尾。看看溫和的力量有多大。

  "太陽":
    teaser:
      friend: |
        黃太陽的人是「照亮者」——你把光帶給人。但你會發現一件事：你為了照亮別人耗盡自己，又不允許自己有陰天。光也需要被照。
    full:
      master:
        core: |
          照亮者。把光帶給人，照見就是他存在的方式。
        shadow: |
          為照亮別人耗盡自己。不允許自己有陰天。把「正向」變成壓力。
        milestones:
          - "20-30 歲：自然成為團體的光"
          - "35+：認清「光也需要被照」"
          - "40+：若仍只給不收，會出現深度倦怠"
        inquiries:
          - "你最近一次允許自己「不發光」？"
          - "誰會在你陰天時陪你？"
          - "你怕暗下來會發生什麼？"
        crosses:
          - "配紅龍：給予到耗盡"
          - "配白狗：為愛犧牲過度"
          - "對沖藍夜：光與夢的角力"
        focus: |
          這週給自己 1 天「不為別人發光」——不回訊息、不打氣、不安慰人。就是自己暗一天。
