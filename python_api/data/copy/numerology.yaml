# =====================================================================
# Mele 命理媒介中心 — 生命靈數解讀文案
# =====================================================================
# 客戶端 (/tools/numerology) 永遠使用 teaser.friend（短初盤）
# 老師後台命盤頁可切換三種 voice：scholar / friend / master，皆 full 深度
#
# Voice 設計：
#   scholar = 溫暖學者：理論框架 + 同理視角，「他不是壞，是他靈魂的形狀」
#   friend  = 朋友式：聊天感、共感、像跟同事討論個案
#   master  = 溫暖長者：權威 + 關懷，敢說重話但是出於愛
#
# 結構（full mode 6 區塊）：
#   core       — 核心命題（一段散文）
#   shadow     — 陰影面（一段散文）
#   milestones — 關鍵時刻（條列 3 項）
#   inquiries  — 諮詢探問（條列 3 項，老師可問客戶的問題）
#   crosses    — 盤面交叉（條列 3 項，與其他數字 / 流年的交互）
#   focus      — 本次會談聚焦（一段散文）
#
# 編修指引：
#   - 禁用詞：能量、頻率、共振、調頻、敏銳度
#   - 禁用句式：「主題是 X 與 Y」「也要避免...」
#   - 必備元素：暗面、具體時刻、具體場景、立場
# =====================================================================

schema_version: 1

life_paths:
  "1":
    teaser:
      friend: |
        1 號的人從小就發現自己跑得比較快。問題不在你跑，是你開始懷疑為什麼別人都跟不上——然後你也懶得解釋。30 歲前這還能撐，30 歲後你會發現「一個人贏」其實沒什麼意思。
    full:
      scholar:
        core: |
          1 在畢氏數秘學裡被稱為「first cause」——萬物開始的那個點。1 號的人天生帶著「先走一步」的氣質：先說出眾人不敢說的話、先做出別人還在觀望的決定。這不是好強，是他靈魂的形狀。
        shadow: |
          因為走得快，他常常等不到別人——於是學會了不解釋。久而久之變成一個現象：他什麼都自己扛，不是因為驕傲，是覺得「講了你也跟不上」。最孤獨的不是一個人，是身邊明明有人卻無法分享。
        milestones:
          - "28-32 歲是他第一次體驗「個人能力上限」的階段——通常會有一次健康警訊或合作崩盤"
          - "35-38 歲是團隊領導力的發育期，這時學帶人還來得及，再晚會吃力"
          - "40 歲之後合夥的誘惑會再來一次，他需要被提醒當年發生過什麼"
        inquiries:
          - "最近一次跟人合作鬧翻，是什麼時候？發生了什麼？"
          - "在你身邊，還有誰會願意等你把話講完？"
          - "假設今天是你最後一天，你最遺憾沒讓誰知道你在想什麼？"
        crosses:
          - "如果生日數也是 3，他的孤狼氣質會更強，有時會用幽默掩蓋自己其實累了"
          - "如果生日數是 6，他習慣壓抑情緒，到中年容易突然崩盤"
          - "走到 8 號流年時，權力慾望會放大，陪他檢視「我到底為什麼想要這個」很關鍵"
        focus: |
          建議引導他談一次「最近想自己扛、但其實扛得很重」的具體事件。重點不是給建議，是讓他聽見自己說出來——他多半很久沒有對人說過這件事了。
      friend:
        core: |
          1 號的人從小就發現自己比別人快。這不是優越感，是觀察事實。
        shadow: |
          合夥三年必鬧翻——他真的等不下去。「我自己來」其實是他不想跟人吵架。越聰明越孤獨，因為他懶得解釋自己。
        milestones:
          - "28-32 歲：第一次發現「靠自己」撐不住"
          - "35-38 歲：再不學帶人就要卡關"
          - "40+：合夥的誘惑會再來一次，要陪他抗住"
        inquiries:
          - "最近一次跟人合作鬧翻，是什麼時候？"
          - "你身邊還有人願意聽你把話講完嗎？"
          - "如果你現在死掉，最後悔沒讓誰知道你在想什麼？"
        crosses:
          - "同時是 3 號生日：他孤狼+表演型，會很累"
          - "同時是 6 號生日：他會壓抑很久才爆"
          - "流年走到 8：權力慾上升，要陪他看清楚動機"
        focus: |
          帶他講出一次「想自己扛卻發現太重」的具體事件，陪他承認那個重量。
      master:
        core: |
          第一個發聲的人。沒有他開口，事情不會發生——這是 1 號最美的本質。
        shadow: |
          他不是不願意溝通，是他覺得「等你跟上太累了」。所以「我自己來」變成口頭禪。其實他想被理解，只是不知道怎麼開口。
        milestones:
          - "28-32 歲：第一次撞牆。他可能會說「我沒事」——但其實這是他人生第一次真的需要幫忙"
          - "35-38 歲：學會帶人的窗口。再晚一點他會發現自己一輩子單打獨鬥"
          - "40 歲之後：合夥的誘惑會回來。陪他想清楚再決定"
        inquiries:
          - "最近一次跟人合作鬧翻，是什麼時候？"
          - "你身邊，還有誰會等你把話講完？"
          - "如果今天是最後一天，你最遺憾沒讓誰知道你的想法？"
        crosses:
          - "如果生日是 3 號 → 孤狼氣味更濃，他常用幽默蓋住累"
          - "如果生日是 6 號 → 他會壓抑很久，中年容易突然崩"
          - "流年走到 8 → 權力慾上升，這時陪他看清「我為什麼想要」"
        focus: |
          帶他談一次「最近想自己扛、但其實扛得很重」的事。不用急著給建議——讓他聽見自己說出來。這種人，講出來那一刻就已經療癒一半。

  "2":
    teaser:
      friend: |
        2 號的人最常聽到別人說「跟你聊天好舒服」——因為你會接得住每一句話的情緒。但你會發現一件殘忍的事：那些誇你舒服的人，下一次不會主動關心你。你要練的不是讀懂別人，是練習「不讀」。
    full:
      scholar:
        core: |
          2 在畢氏學派裡是「the witness」——見證者、二元、對照。2 號的人有一項罕見的天賦：他能讀到別人沒說出口的情緒，連那個欲言又止的微小停頓，他都接得到。這不是諂媚，是他靈魂的雷達。
        shadow: |
          因為太會讀，他常把別人的情緒誤判成自己的責任。他在關係裡擅長忍讓——但忍讓久了，他自己也不知道自己想要什麼。最辛苦的是：他周圍會慢慢累積一群「只索取不回應」的人，因為他訓練了大家可以不用問候他。
        milestones:
          - "18-24 歲是讀心能力快速成熟的階段，但這時還沒人教他「設限」"
          - "28-32 歲他會第一次認真覺得「我也想被看見」——這是關鍵的覺醒時刻"
          - "35 歲之後若仍承擔別人的情緒，身體會替他開始抗議：失眠、胃痛、慢性疲勞"
        inquiries:
          - "在你身邊，有沒有人從來不主動問你「你今天怎麼樣」？"
          - "上一次你替別人忍下情緒，是什麼時候？"
          - "假設今天沒有任何人需要你，你會做什麼？"
        crosses:
          - "如果生日數也是 6，他會發展成保母型人格，照顧深入到犧牲層次"
          - "如果生日數是 8，他可能用「我懂你」換取關係主導——自己沒察覺"
          - "走到 1 號流年，宇宙在強迫他練「自主」，這是練設限最好的時機"
        focus: |
          引導他指認一段「只有他在問候對方」的關係，討論退場的節奏——不是切斷，是降頻。他需要先發現「原來我可以不接這通電話」。
      friend:
        core: |
          2 號的人天生會接情緒。對話間的微小停頓、語氣的薄薄不對勁，他都讀得到——這不是技能，是本能。
        shadow: |
          把別人情緒當自己責任；連「等一下」都很難說出口；身邊累積一堆只索取不回應的人。
        milestones:
          - "18-24 歲：讀心讀得很爽，但開始累"
          - "28-32 歲：發現自己其實一直沒被認真關心過"
          - "35+：身體開始抗議，可能是失眠、胃痛、慢性疲勞"
        inquiries:
          - "身邊有沒有人從來不主動問你「你還好嗎」？"
          - "最近一次替別人忍下情緒是什麼時候？"
          - "如果今天沒有任何人需要你，你會做什麼？"
        crosses:
          - "同時是 6 號生日：他會變保母型，越愛越累"
          - "同時是 8 號生日：他用讀心換掌控，自己也沒察覺"
          - "流年走到 1：宇宙在逼他自主，正是練習設限的時機"
        focus: |
          陪他找出一段「只有他在問候對方」的關係，討論怎麼退場。
      master:
        core: |
          接得住別人沒說出口的話。讀心，不是技能，是他天生的雷達——這是 2 號最珍貴的禮物。
        shadow: |
          「我沒事」是他最大的謊言。他訓練了周圍的人不用問候他，然後自己默默累——其實他只是不知道怎麼開口要關心。
        milestones:
          - "18-24 歲：讀心能力強，但還沒學會設限"
          - "28-32 歲：第一次覺得「沒人真的在乎我」——這是他要醒的時刻"
          - "35+：身體會替他拒絕"
        inquiries:
          - "有沒有人從來不主動問你「你還好嗎」？"
          - "上一次替別人忍下情緒？"
          - "沒人需要你的一天，你想怎麼過？"
        crosses:
          - "配 6 號生日 → 保母人格，照顧到忘了自己"
          - "配 8 號生日 → 用「我懂你」換掌控，自己沒察覺"
          - "流年 1 號 → 設限訓練窗口"
        focus: |
          找一段他單向付出的關係，討論「降頻」的具體步驟。不是切斷——是讓他練習「不接這通電話也沒關係」。

  "3":
    teaser:
      friend: |
        3 號的人最會把無聊講成有趣。但你私底下有個秘密：你常常不知道自己真正怎麼想，要等講出來才知道。你會發現自己對著錯的人講真話，對著重要的人講漂亮話——因為對方期待你有趣。換一個會等你講完的朋友，比換工作重要。
    full:
      scholar:
        core: |
          3 在數字學裡是「the speaker」——三元組合、語言、敘事的原型。3 號的人天生會用語言把感受整理出來：說、寫、唱、演——這些不只是表達方式，是他確認自己存在的方式。
        shadow: |
          有個秘密只有 3 號自己知道：他常常是邊講邊發現自己想什麼的。這讓他有個特殊的痛苦——對重要的人，他越想講漂亮話、不想搞砸；對陌生人或路人，他反而能講真心話。久而久之，他最在乎的人其實沒有看到他真正的樣子。
        milestones:
          - "20-25 歲是他尋找個人表達形式的關鍵窗口（寫作、影片、舞台、播客）"
          - "28-32 歲會第一次體驗「無話可說」的失語狀態——這不是壞事，是他開始要面對自己的訊號"
          - "35 歲之後若仍以表演換取存在感，會出現深度疲勞與「我到底是誰」的自我懷疑"
        inquiries:
          - "最近有沒有想對某個重要的人講真話，但你選了得體的版本？"
          - "你發表的內容裡，多少是真心，多少是表演？"
          - "如果沒有任何人在看，你還會繼續創作嗎？"
        crosses:
          - "如果生日數是 7，他有思考深度也有表達力，但要注意修辭不要遮蔽思考"
          - "如果生日數是 5，他的主題會跳很快，難累積影響力"
          - "走到 4 號流年，宇宙在強迫他專注與紀律，是檢驗作品力的時機"
        focus: |
          找出他最近一句「拖著沒講出口的真話」，陪他算清楚拖延的成本——通常不是怕對方生氣，是怕對方失望。
      friend:
        core: |
          3 號的人講話就是好聽。同一件事他講出來總是比較生動。但他自己有個秘密：很多時候他是邊講邊發現自己想什麼。
        shadow: |
          對重要的人講漂亮話、對陌生人講真話；害怕沉默、害怕對方不笑；創作完之後對自己作品產生不真實感。
        milestones:
          - "20-25 歲：找到自己的表達形式（寫作 / 影片 / 演講）"
          - "28-32 歲：第一次寫不出、講不出、創作不出"
          - "35+：開始懷疑自己的「有趣」是不是裝出來的"
        inquiries:
          - "最近想對誰講真話但選擇講得體的版本？"
          - "你發表的內容裡多少是表演、多少是真心？"
          - "如果沒人在看，你還會繼續做嗎？"
        crosses:
          - "同時是 7 號生日：他想得深也講得好，但小心修辭遮蔽思考"
          - "同時是 5 號生日：他主題會跳，難累積"
          - "流年走到 4：宇宙逼他專注，是練真功夫的時候"
        focus: |
          找出他最近一句「拖著沒講出口的真話」，陪他算清楚拖延的成本。
      master:
        core: |
          被聽見才覺得活著。3 號的人，講出來才知道自己怎麼想——這是他的工作方式，不是缺點。
        shadow: |
          越重要的人，他越不敢講真話。不是不誠實，是他太怕對方失望。所以他最深的話常常講給陌生人聽。
        milestones:
          - "20-25 歲：找到自己的舞台（寫作 / 影片 / 演講）"
          - "28-32 歲：第一次失語——這是他要面對自己的時候"
          - "35+：開始懷疑「我的有趣是不是裝出來的」"
        inquiries:
          - "最近一句拖著沒講出口的真話？"
          - "作品多少是真心，多少是表演？"
          - "沒人看你還會做嗎？"
        crosses:
          - "配 7 號生日 → 想得深也講得好，但修辭可能蓋過內容"
          - "配 5 號生日 → 主題會跳，難累積"
          - "流年 4 號 → 強制專注期"
        focus: |
          把那句「拖著沒講」的真話拆解：對誰、什麼時候、不講的成本是什麼。多半他怕的不是吵架——是對方失望。

  "4":
    teaser:
      friend: |
        4 號的人最容易被別人說「你怎麼這麼龜毛」。你不是龜毛，是你看得到事情會在哪裡崩——而你想救它。問題是你會把這套用在感情上，列清單去管理一段關係。然後對方覺得自己變成你 to-do list 的一項。把工作的 4 留在工作。
    full:
      scholar:
        core: |
          4 在畢氏體系裡是實體世界的基礎——四元素、四方位、四季。4 號的人天生會看到事情會在哪裡崩，他不是悲觀，是預測能力強——他想救。把混亂變秩序，把不確定變流程，是他的天賦。
        shadow: |
          但這份能力有副作用：他會把工作的「整理」帶回家，連感情、創造、生活都想用清單管。對方會覺得自己變成他 to-do list 的一項。更內在的是——他用「還沒準備好」當作延遲行動的理由，完美主義成了一種精緻的拖延。
        milestones:
          - "25-30 歲建立第一個成熟的個人系統（飲食、工作流、財務）"
          - "32-38 歲系統思維開始入侵私領域，關係會出現結構性壓力"
          - "40 歲之後如果沒鬆動，身體會替他承擔——肩頸僵硬、消化系統、慢性緊繃"
        inquiries:
          - "最近一次你想「管理」一段感情，是什麼時候？"
          - "你有沒有一塊生活區，是你刻意不整理的？"
          - "你最怕事情失控變成什麼樣子？"
        crosses:
          - "如果生日數是 1，他容易變成系統獨裁者，團隊會覺得壓力大"
          - "如果生日數是 8，規則感會與權力慾結合，容易過度控制"
          - "走到 3 號流年，宇宙在強迫他彈性、表達、放鬆——這是鬆動完美主義的好時機"
        focus: |
          找一個他「曾經想整理但失敗」的關係或計畫，陪他試一次「不再校正」。他需要先發現：沒有完美規劃也沒事。
      friend:
        core: |
          4 號的人天生會看到事情會在哪裡崩。他不是悲觀，是預測能力強——而他想救。
        shadow: |
          把工作的「整理」帶回家，搞得家人覺得自己是任務；永遠覺得「還沒準備好」所以開始的事很少；不耐受混亂但混亂常是創造力的前奏。
        milestones:
          - "25-30 歲：建立第一個個人系統（飲食/工作流/財務）"
          - "32-38 歲：把系統用在感情上，對方覺得壓力大"
          - "40+：身體開始僵硬——肩頸、腰、消化系統"
        inquiries:
          - "最近一次你想「管理」一段感情是什麼時候？"
          - "有沒有一塊生活區是你刻意不整理的？"
          - "你最怕事情失控變成什麼樣子？"
        crosses:
          - "同時是 1 號生日：系統 + 獨裁，團隊難帶"
          - "同時是 8 號生日：規則感變掌控慾"
          - "流年走到 3：宇宙逼他彈性、表達、放鬆"
        focus: |
          找出一個他「曾經試圖整理但失敗」的關係或計畫，陪他試著放手。
      master:
        core: |
          看得到事情會在哪裡崩。4 號的人是補洞的天才——這是他最美的本能。
        shadow: |
