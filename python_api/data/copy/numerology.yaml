    teaser:
      friend: |
        9 號的人從小就有種「老靈魂」感——你會關心戰爭、流浪狗、陌生人，但常忘記自己上一頓吃了沒。你以為你在愛世界，其實你在用世界逃自己。先把自己照顧好不是自私，是你準備好之後才真的能幫人。
    full:
      scholar:
        core: |
          9 在畢氏學派裡是最後的單位數，象徵一個循環的終點與下一階段的孕育。9 號的人從小有種「老靈魂」感——他會擔心遠方的事，戰爭、流浪狗、地球暖化。這份大視野，是他天生的禮物。
        shadow: |
          但這份大視野有個代價：他用世界逃自己——關心他人比關心自己容易。該結束的事他會拖很久，「再給一次機會」是他的口頭禪。把自我照顧當成自私——這是他最深的誤解。
        milestones:
          - "童年起對死亡、苦難異常敏感（早於同齡的關懷視角）"
          - "30-38 歲家族議題或前期循環的未竟之事浮現——他常在處理上一代沒處理完的事"
          - "40 歲之後若未完成關鍵的結束，會出現生命停滯感"
        inquiries:
          - "你現在還在硬撐的關係或項目是什麼？"
          - "在你的家族裡，有沒有一個議題是你想替誰結束的？"
          - "如果允許自己自私一年，你會做什麼？"
        crosses:
          - "如果生日數是 6，他照顧範圍從家擴及全人類，自我照顧近乎缺席"
          - "如果生日數是 3，可能發展成「表演型救世主」——以助人的語彙獲取注意"
          - "走到 1 號流年，宇宙在開啟新循環——這是對應「結束舊事」最關鍵的窗口"
        focus: |
          引導他具體指認一件「需要結束但尚未結束」的事，討論放下的最小可行步驟。他要先發現：結束不是失敗，是讓位給下一個循環。
      friend:
        core: |
          9 號的人有種老靈魂感。他從小就會擔心遠方的事——戰爭、流浪狗、地球暖化——但常常忘記自己今天有沒有吃飯。
        shadow: |
          用世界逃自己——關心他人比關心自己容易；該結束的事拖很久——「再給一次機會」是他的口頭禪；把自我照顧當成自私。
        milestones:
          - "童年起：對死亡、苦難異常敏感"
          - "30-38 歲：家族議題浮現——他在處理上一代沒處理完的事"
          - "40+：若沒結束該結束的會覺得人生卡住"
        inquiries:
          - "你現在還在硬撐的事是什麼？"
          - "家族裡有沒有一個議題你想替誰結束？"
          - "如果允許自己自私一年，你會做什麼？"
        crosses:
          - "同時是 6 號生日：他照顧全世界，獨漏自己"
          - "同時是 3 號生日：他可能變表演型救世主，自己沒察覺"
          - "流年走到 1：宇宙在開啟新循環，逼他先結束舊事"
        focus: |
          陪他指出一件「該結束但拖著沒結束」的事，討論放下的最小一步。
      master:
        core: |
          老靈魂。在收尾一個比個人更大的東西——這是 9 號的命運，不是負擔。
        shadow: |
          他用世界逃自己——關心他人比關心自己容易。該結束的拖很久，把自我照顧當自私。其實他只是還沒被允許「為自己活」。
        milestones:
          - "童年起：對苦難異常敏感"
          - "30-38 歲：家族議題浮現"
          - "40+：未結束則停滯"
        inquiries:
          - "現在還在硬撐的是什麼？"
          - "家族裡你想替誰結束哪件事？"
          - "自私一年，你會做什麼？"
        crosses:
          - "配 6 號生日 → 照顧全世界漏自己"
          - "配 3 號生日 → 表演型救世主"
          - "流年 1 號 → 必須先結束舊循環"
        focus: |
          一件該結束卻拖著的事。問他：結束的最小一步是什麼？那一步今天能做嗎？結束不是失敗，是讓位給下一個循環。
