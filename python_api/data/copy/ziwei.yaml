# =====================================================================
# Mele 命理媒介中心 — 紫微斗數文案
# =====================================================================
# v1 範圍：
#   - main_stars      : 14 主星 × (teaser + master 五區塊)
#   - palaces         : 12 宮位（命宮 / 兄弟 / 夫妻 / ...）
#   - great_cycles    : 大運基本概念與起運提醒
#
# 客戶端 (/tools/ziwei) 使用 teaser.friend
# 老師後台 voice tab 切換 full.master
#
# 之後再補：副星（左輔右弼文昌文曲...）、四化、三方四正組合
#
# Voice 原則：master = 溫暖長者，敢說重話、有時刻、有暗面、有立場
# =====================================================================

schema_version: 1

# ---------------------------------------------------------------------
# 14 主星
# ---------------------------------------------------------------------
main_stars:
  "紫微":
    grouping: "紫微星系（北斗）"
    nature: "尊星 / 帝座 / 土"
    teaser:
      friend: |
        紫微是「帝星」——你天生帶著「我要當主事者」的氣質。問題不在你會做主，是你太怕沒坐在主位上。30 歲後你會學會：真正的權威不必坐在中間。
    full:
      master:
        core: |
          領導氣質、有大局觀、需要被尊重才能發揮。
        shadow: |
          自尊過強、聽不進忠言、把「我是為大局好」當不解釋的擋箭牌。
        milestones:
          - "20-30 歲：證明自己能當主事的階段"
          - "30-40 歲：第一次發現「主位是負擔」"
          - "40+：學會「放權不是失位」的人生課"
        focus: |
          這個月主動讓出一次主導權給身邊有能力的人。看世界會不會崩——不會。
        relationship: |
          需要被尊重的伴侶——但對方若一直崇拜你也會讓你疲倦。

  "天機":
    grouping: "紫微星系（南斗）"
    nature: "兄弟主 / 善星 / 木"
    teaser:
      friend: |
        天機是「智謀星」——你思緒快、會分析、什麼事都想得到。問題不在你聰明，是你想太多反而走不動。30 歲後你會學會：知道答案跟做出答案是兩件事。
    full:
      master:
        core: |
          思緒靈活、好學、善於分析與策略。
        shadow: |
          多疑、神經質、把分析當不行動的擋箭牌、變動性過高。
        milestones:
          - "20-30 歲：靠頭腦快速累積跨領域知識"
          - "30-38 歲：第一次「想到力盡但什麼都沒做完」的卡點"
          - "40+：學會「先做再修」勝過「想清再做」"
        focus: |
          這個月選一件事，做之前只想 10 分鐘就動手。看效果跟想 10 天差多少。
        relationship: |
          需要能跟上你思考速度、又能讓你停下來的伴侶。

  "太陽":
    grouping: "紫微星系（中天）"
    nature: "貴星 / 官祿主 / 火"
    teaser:
      friend: |
        太陽是「父星」——你會發光、會帶動氣氛、是天生的表現者。問題不在你愛被看見，是你不被看見就很失落。30 歲後你會學會：暗下來不是失敗，是充電。
    full:
      master:
        core: |
          外放、熱情、有領袖魅力、是公眾型人格。
        shadow: |
          愛面子、過度表現、用發光遮住內在脆弱、男女關係上對父權議題敏感。
        milestones:
          - "20-30 歲：站在舞台上的甜頭"
          - "30-38 歲：第一次承認「我累了」的內在崩塌"
          - "40+：學會「不發光時我是誰」"
        focus: |
          這個月安排 3 天不對外發光——關社群、不接案、不主動聯絡。
        relationship: |
          需要能欣賞你又不被你掌聲淹沒的伴侶。

  "武曲":
    grouping: "紫微星系（北斗）"
    nature: "財星 / 將星 / 金"
    teaser:
      friend: |
        武曲是「財星 + 將星」——你務實、能存、有執行力。問題不在你硬，是你硬到把人也當數字管理。30 歲後你會學會：感情不是 KPI。
    full:
      master:
        core: |
          務實、強執行力、適合理財與專業技藝。
        shadow: |
          剛硬、不通情、把效率當人生唯一指標、感情壓抑。
        milestones:
          - "25-32 歲：靠紀律打下物質基礎"
          - "30-40 歲：發現「賺到了但沒人陪」的孤獨"
          - "40+：學會「軟也是一種強」"
        focus: |
          這個月做一件「不計回報」的事——時間、心力給人，不要算。
        relationship: |
          需要能戳破你硬殼、又不會被你壓制的伴侶。

  "天同":
    grouping: "紫微星系（南斗）"
    nature: "福星 / 益壽 / 水"
    teaser:
      friend: |
        天同是「福星」——你天性溫和、知足、能享受小事。問題不在你慢，是你慢到該動的時候也不動。30 歲後你會學會：福氣若沒搭配行動，會變成倦怠。
    full:
      master:
        core: |
          溫和、樂觀、有福氣、能享受平凡。
        shadow: |
          逃避責任、用「我就是這樣」拒絕長大、缺乏鬥志。
        milestones:
          - "童年起：被當乖小孩、好相處"
          - "30+：第一次面對「沒人會替我推動」的處境"
          - "40+：若仍逃避主動，會出現中年遲滯感"
        focus: |
          這個月主動承擔一件「明知麻煩」的事。福氣會跟責任感一起長大。
        relationship: |
          需要能推你一把、又不會把你逼太緊的伴侶。

  "廉貞":
    grouping: "紫微星系（北斗）"
    nature: "囚星 / 次桃花 / 火"
    teaser:
      friend: |
        廉貞是「次桃花 + 囚星」——你魅力強、有原則、但也容易被自己的執念綁住。30 歲後你會學會：你綁的那個原則，有些早就過期了。
    full:
      master:
        core: |
          魅力、有手腕、原則性強、適合公關 / 司法 / 紀律相關。
        shadow: |
          固執、桃花糾葛、把「我有原則」當無法溝通的擋箭牌、情緒積壓。
        milestones:
          - "20-30 歲：靠魅力與原則性開展事業"
          - "30-38 歲：第一次被自己定的規則困住"
          - "40+：學會「鬆綁不是失格」"
        focus: |
          這個月鬆綁一條你堅持很久但其實傷自己的原則。
        relationship: |
          桃花重但易糾纏。需要能讓你誠實面對情感的伴侶。

  "天府":
    grouping: "南斗主星（紫微對宮帝星）"
    nature: "祿庫 / 令星 / 土"
    teaser:
      friend: |
        天府是「祿庫」——你穩、會儲存、是天然的管家型。問題不在你保守，是你保守到不肯動用既有資源。30 歲後你會學會：庫房不流動就是死庫存。
    full:
      master:
        core: |
          穩重、有管理才能、累積資源能力強。
        shadow: |
          保守、抗拒改變、把守成當不冒險的擋箭牌、易被當「沒野心」。
        milestones:
          - "25-35 歲：穩定累積資產與信用"
          - "35-45 歲：第一次「該動用儲備但捨不得」"
          - "45+：學會「庫房是工具不是目的」"
        focus: |
          這個月主動動用一筆你存了很久的資源做一件投資 / 投入。
        relationship: |
          需要能逼你流動但不揮霍的伴侶。

  "太陰":
    grouping: "紫微星系（中天）"
    nature: "母星 / 田宅主 / 水"
    teaser:
      friend: |
        太陰是「母星」——你細膩、感受深、會照顧人。問題不在你溫柔，是你溫柔到把自己的需要也藏起來。30 歲後你會學會：被照顧是健康的，不是軟弱。
    full:
      master:
        core: |
          感性、藏深、富有同理心、適合藝術 / 教育 / 療癒。
        shadow: |
          情緒化、過度照顧他人而忽略自己、易被消耗、夜晚特別敏感。
        milestones:
          - "20-30 歲：靠細膩感知建立關係資本"
          - "30-38 歲：第一次「我也想被照顧」的崩潰"
          - "40+：學會「先滿自己再給人」"
        focus: |
          這個月對一個信任的人提出「我需要這樣被對待」。具體說出來。
        relationship: |
          需要能主動關心你細微感受的伴侶。

  "貪狼":
    grouping: "北斗（紫微星系）"
    nature: "桃花星 / 慾望 / 木"
    teaser:
      friend: |
        貪狼是「桃花星 + 慾望」——你多才多藝、人緣好、對所有事情都有興趣。問題不在你貪，是你貪到什麼都沾一點但什麼都不深。30 歲後你會學會：所有都要 = 什麼都拿不到。
    full:
      master:
        core: |
          多才、活力、人脈廣、對美與享受敏感。
        shadow: |
          慾望多、難專注、桃花重、把「我什麼都想試」當不承諾的擋箭牌。
        milestones:
          - "20-30 歲：靠多元探索找到自我"
          - "30-38 歲：第一次「廣度換不到深度」的撞牆"
          - "40+：學會「選擇就是放棄」"
        focus: |
          這個月選一個方向，承諾 90 天不沾其他誘惑。
        relationship: |
          桃花最重。需要能讓你心服口服「就她（他）」的伴侶。

  "巨門":
    grouping: "北斗（紫微星系）"
    nature: "暗星 / 是非星 / 水"
    teaser:
      friend: |
        巨門是「口舌之星」——你善表達、有獨到見解、辯才無礙。問題不在你會說，是你說的常常傷到你不想傷的人。30 歲後你會學會：話的力量不在量，在準。
    full:
      master:
        core: |
          表達力強、善於分析與辯論、適合教育 / 媒體 / 法律。
        shadow: |
          口舌是非、過度懷疑、用毒舌掩飾不安、易招小人。
        milestones:
          - "20-28 歲：靠口才打開機會"
          - "28-35 歲：第一次因「說錯話」付重代價"
          - "35+：學會「不說也是力量」"
        focus: |
          這個月每天記錄一句「該說沒說 / 不該說卻說了」的話。練習口的禪定。
        relationship: |
          需要能跟你過招、又不會被你的口傷到的伴侶。

  "天相":
    grouping: "南斗（紫微星系）"
    nature: "印星 / 官祿之佐 / 水"
    teaser:
      friend: |
        天相是「印星」——你穩重、講究禮節、是天然的副手 / 顧問。問題不在你願意輔佐，是你太把「不踰矩」當成不敢主動。30 歲後你會學會：適時越線才是真智慧。
    full:
      master:
        core: |
          穩重得體、講原則、適合顧問 / 行政 / 法務 / 仲裁。
        shadow: |
          過度顧及他人面子、缺乏主動性、把「我是副手」當不擔責任的擋箭牌。
        milestones:
          - "20-30 歲：靠服務與輔佐累積信用"
          - "30-40 歲：第一次「我也想被輔佐」"
          - "40+：學會「副手位也能主導大局」"
        focus: |
          這個月主動提案一件「不在我職責內」的事。
        relationship: |
          需要能讓你不必當好人也被愛的伴侶。

  "天梁":
    grouping: "南斗（紫微星系）"
    nature: "蔭星 / 父母主 / 土"
    teaser:
      friend: |
        天梁是「蔭星」——你有長者氣質、會照顧人、原則感強。問題不在你想幫人，是你常常用「過來人」姿態壓人。30 歲後你會學會：建議若沒被請求，就是壓力。
    full:
      master:
        core: |
          有長者智慧、原則感強、適合教育 / 醫療 / 公益。
        shadow: |
          愛說教、自視甚高、孤芳自賞、用「我為你好」拒絕被反駁。
        milestones:
          - "25-35 歲：靠原則感建立社會地位"
          - "35-45 歲：第一次「沒人想聽我講道理」的孤立"
          - "45+：學會「閉嘴也是慈悲」"
        focus: |
          這個月有人來找你訴苦時，只聽不給建議。練習單純的陪伴。
        relationship: |
          需要能反駁你又不被你說教壓住的伴侶。

  "七殺":
    grouping: "南斗 / 殺破狼"
    nature: "將星 / 肅殺 / 金"
    teaser:
      friend: |
        七殺是「將星」——你決斷、敢拼、有開創力。問題不在你殺氣重，是你開戰前常忘了問「為什麼要打」。30 歲後你會學會：贏了戰但失了人，不是真贏。
    full:
      master:
        core: |
          決斷、勇猛、開創力強、適合創業 / 競爭環境。
        shadow: |
          衝動、孤狠、用結果合理化過程的傷害、易孤立。
        milestones:
          - "20-30 歲：靠開創力打下事業基礎"
          - "30-38 歲：第一次「贏了戰但沒人陪」的孤獨"
          - "40+：學會「不戰也是戰略」"
        focus: |
          這個月對一場想開的戰按下暫停 7 天。不打也不撤，先看清。
        relationship: |
          需要能承受你戰場氣質、又能讓你回家放下武器的伴侶。

  "破軍":
    grouping: "北斗 / 殺破狼"
    nature: "耗星 / 變動 / 水"
    teaser:
      friend: |
        破軍是「先破後立」——你天生愛打破現狀、創造新局。問題不在你破，是你破完不一定立得起來。30 歲後你會學會：每一次破之前先想：我接下來要建什麼？
    full:
      master:
        core: |
          開創、變動力強、敢於打破既有秩序。
        shadow: |
          衝動、耗損、為破而破、不善守成、人生起伏大。
        milestones:
          - "20-30 歲：頻繁打破舊框架"
          - "30-38 歲：第一次「破完發現沒蓋好」的代價"
          - "40+：學會「先設計再破」"
        focus: |
          這個月對一件想破的事先寫出「破完之後要建什麼」的具體計畫。
        relationship: |
          婚姻易變動。需要能接受你週期性破立的伴侶。

# ---------------------------------------------------------------------
# 12 宮位
# ---------------------------------------------------------------------
palaces:
  "命宮":
    domain: "本命 / 自我核心"
    teaser: |
      命宮是「你的本」——所有星曜在這裡的解讀最重。命宮坐什麼主星，你就帶著什麼底色出生。
    note: |
      命宮的主星 + 三方四正（遷移、財帛、官祿）是核心命盤。

  "兄弟宮":
    domain: "兄弟 / 同輩 / 合夥"
    teaser: |
      兄弟宮不只是親兄弟——是所有「同輩夥伴」的縮影。包括合夥人、戰友、平輩朋友。
    note: |
      兄弟宮主星若不佳，常反映成事業合作糾葛。

  "夫妻宮":
    domain: "婚姻 / 親密伴侶"
    teaser: |
      夫妻宮揭示你「會被什麼樣的人吸引」與「親密關係的考驗形狀」。
    note: |
      看夫妻宮主星 + 對宮（遷移）+ 三方互動，能描述伴侶基本樣貌。

  "子女宮":
    domain: "子女 / 創造產出 / 性"
    teaser: |
      子女宮不只是親子——是你「創造與延伸」的能力。包括作品、學生、性能量。
    note: |
      子女宮亦為「下一代」象徵，影響投資、創業的延展性。

  "財帛宮":
    domain: "財運 / 賺錢方式"
    teaser: |
      財帛宮是「你怎麼賺」——不是錢的多少，是錢的流動方式與來源性質。
    note: |
      與田宅宮（守財 / 不動產）相輔。財帛主星看流動、田宅看儲存。

  "疾厄宮":
    domain: "健康 / 身體弱點"
    teaser: |
      疾厄宮揭示你身體最容易出狀況的部位與壓力反應模式。
    note: |
      不只看疾病，也看「身體如何反映情緒」。

  "遷移宮":
    domain: "外出 / 對外 / 機會"
    teaser: |
      遷移宮是命宮的對宮——你「離開家門後」會遇到什麼世界。
    note: |
      若命宮空、遷移宮強，常表示「走出去才會發光」。

  "奴僕宮":
    domain: "下屬 / 朋友圈 / 員工"
    teaser: |
      奴僕宮（也稱交友宮）是「你跟下屬 / 朋友圈的互動模式」。
    note: |
      強奴僕宮：得力下屬與朋友；弱奴僕宮：常被拖累。

  "官祿宮":
    domain: "事業 / 職業 / 社會角色"
    teaser: |
      官祿宮是「你的事業樣貌」——適合什麼領域、發展節奏、是否易得名聲。
    note: |
      官祿宮 + 財帛宮 + 命宮形成「事業三方」。

  "田宅宮":
    domain: "不動產 / 家業 / 根基"
    teaser: |
      田宅宮是「你的根」——家庭資產、不動產、長期儲蓄、穩定感的來源。
    note: |
      強田宅：天生有不動產緣；弱田宅：常需自建基業。

  "福德宮":
    domain: "精神享受 / 內在滿足"
    teaser: |
      福德宮是「你內在的快樂源頭」——興趣、嗜好、精神生活的品質。
    note: |
      福德宮直接影響整體命盤的「幸福感」。

  "父母宮":
    domain: "父母 / 長輩 / 上司"
    teaser: |
      父母宮揭示你跟父母 / 長輩 / 上司的互動模式與原生家庭影響。
    note: |
      父母宮亦反映「權威議題」——對上的態度與緣分。

# ---------------------------------------------------------------------
# 大運基本概念
# ---------------------------------------------------------------------
great_cycles:
  intro:
    teaser: |
      大運是「每 10 年走一段不同的星曜組合」——你的命盤不會變，但走過的格局會。
      不同大運強調不同人生面向：有些大運順、有些大運考驗，但沒有「壞」的大運。
    note: |
      大運起點由出生時辰決定。順行 / 逆行依男女陰陽年而定。
      看大運時：本命盤是底色，大運是「這 10 年的調色」。

  master_principles:
    - title: "大運不改命，但改顯化方式"
      detail: |
        命格決定能演什麼戲，大運決定這 10 年演哪一齣。
    - title: "順運別躺、逆運別躲"
      detail: |
        順運要種樹（不是只享受），逆運要修地基（不是只忍耐）。
    - title: "看三方四正勝於看單星"
      detail: |
        大運走入哪個宮位，要連同對宮、左右宮一起看才準。
    - title: "結合大運流年才能精準"
      detail: |
        大運是 10 年大趨勢，流年是這一年的具體節奏。兩者要對齊。
